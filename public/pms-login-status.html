<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 현황 | 사업관리시스템(PMS)</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/pms-lnb.css"><style>
  :root{--bg:#f1f5f9;--surface:#fff;--border:#d8dee8;--text:#1e293b;--muted:#64748b;--brand:#1d6ff2;--navy:#334155;--green:#16a34a}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Noto Sans KR",sans-serif}a{color:inherit;text-decoration:none}ul{list-style:none;margin:0;padding:0}button,input,select{font:inherit}.layout{display:flex;min-height:100vh}.sidebar{width:248px;flex:0 0 248px;background:#fff;border-right:1px solid var(--border)}.sidebar-head{height:60px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid var(--border)}.logo img{height:30px}.nav{padding:16px 12px}.main{min-width:0;flex:1}.topbar{height:60px;padding:0 26px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--border)}.topbar h1{margin:0;font-size:19px}.pms{padding:4px 9px;border-radius:6px;background:#eff6ff;color:var(--brand);font-size:12px;font-weight:700}.user{margin-left:auto;color:#475569}.content{display:grid;gap:18px;min-width:0;padding:26px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.page-head h2{margin:0;font-size:25px;letter-spacing:-.03em}.crumb{color:var(--muted);font-size:13px}.card{background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 1px 2px rgba(15,23,42,.04)}.filters{position:relative;display:grid;padding:10px 150px 10px 20px}.filter-row{display:flex;align-items:center;gap:8px;min-height:50px;border-bottom:1px dashed #cbd5e1}.filter-row:last-of-type{border-bottom:0}.filter-row>label{width:78px;flex:none;white-space:nowrap;font-weight:700;color:#334155}.filter-row>label:before{content:'·';margin-right:6px}.ctrl{height:36px;padding:0 12px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#334155}.basis{width:130px}.date{width:150px}.filter-actions{position:absolute;right:20px;top:50%;display:grid;gap:8px;width:100px;transform:translateY(-50%)}.btn{height:36px;padding:0 16px;border:1px solid var(--navy);border-radius:6px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}.btn-light{border-color:#94a3b8;background:#fff;color:#334155}.report-card{padding:20px}.chart-head{display:flex;align-items:center;margin-bottom:12px}.chart-head h3{margin:0;font-size:17px}.chart-head span{margin-left:8px;color:#64748b}.chart-legend{margin-left:auto;display:flex;align-items:center;gap:7px;color:#475569}.legend-dot{width:10px;height:10px;border-radius:50%;background:var(--brand)}.chart-wrap{position:relative;width:100%;height:340px;border:1px solid #e5e9f0;border-radius:8px;background:#fff;overflow:hidden}.chart-wrap svg{display:block;width:100%;height:100%}.chart-tooltip{position:absolute;z-index:3;padding:8px 11px;border-radius:6px;background:#0f172a;color:#fff;font-size:12px;pointer-events:none;transform:translate(-50%,calc(-100% - 12px));white-space:nowrap}.chart-tooltip[hidden]{display:none}.table-scroll{margin-top:18px;overflow-x:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;min-width:900px;border-collapse:collapse}th,td{height:46px;padding:9px 12px;border-right:1px solid #e5e9f0;border-bottom:1px solid #e5e9f0;text-align:center;white-space:nowrap}th:last-child,td:last-child{border-right:0}thead th{background:#f1f5f9;color:#334155;font-size:13px}tbody tr:last-child td{border-bottom:0}.value-link{color:#0969da;text-decoration:underline}.report-actions{display:flex;justify-content:flex-end;margin-top:12px}.btn-excel{border-color:var(--green);background:var(--green)}.toast{position:fixed;left:50%;bottom:30px;z-index:1000;transform:translateX(-50%);padding:11px 18px;border-radius:999px;background:#0f172a;color:#fff}.toast[hidden]{display:none}@media(max-width:900px){.sidebar{display:none}.content{padding:18px}.page-head{align-items:flex-start;flex-direction:column}.filters{padding-right:20px}.filter-actions{position:static;display:flex;width:auto;transform:none}.filter-row{flex-wrap:wrap}.chart-wrap{height:290px}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="sidebar-head"><a class="logo" href="/"><img src="/images/kepco-es-logo.png" alt="켑코이에스 주식회사"></a></div><nav class="nav" aria-label="주 메뉴"><ul></ul></nav></aside><div class="main"><header class="topbar"><h1>사업관리시스템</h1><span class="pms">PMS</span><span class="user"><b>이희성 부장</b> [시스템관리자]</span></header><main class="content"><div class="page-head"><h2>로그인 현황</h2><div class="crumb">HOME　›　공통 관리　›　<b>로그인 현황</b></div></div>
  <section class="card" aria-label="검색 조건"><form class="filters" id="searchForm"><div class="filter-row"><label for="basis">기준</label><select class="ctrl basis" id="basis"><option value="daily">일 단위</option><option value="monthly" selected>월 단위</option><option value="yearly">연 단위</option></select></div><div class="filter-row"><label>조회기간</label><input class="ctrl date" id="startDate" type="month" value="2026-01" aria-label="시작 기간"><span>~</span><input class="ctrl date" id="endDate" type="month" value="2026-11" aria-label="종료 기간"></div><div class="filter-actions"><button class="btn" type="submit">검색</button><button class="btn btn-light" type="reset">초기화</button></div></form></section>
  <section class="card report-card"><div class="chart-head"><h3 id="chartTitle">월별 로그인 횟수</h3><span id="periodText">2026.01 ~ 2026.11</span><div class="chart-legend"><span class="legend-dot"></span>로그인 횟수</div></div><div class="chart-wrap" id="chartWrap"><svg id="loginChart" viewBox="0 0 1000 330" role="img" aria-labelledby="chartTitle"></svg><div class="chart-tooltip" id="chartTooltip" hidden></div></div><div class="table-scroll"><table><thead id="resultHead"></thead><tbody id="resultBody"></tbody></table></div><div class="report-actions"><button class="btn btn-excel" id="excel" type="button">다운로드(Excel)</button></div></section>
</main></div></div><div class="toast" id="toast" hidden></div><script>
var datasets={daily:{labels:['08.10','08.11','08.12','08.13','08.14','08.15','08.16','08.17','08.18','08.19'],values:[78,92,81,105,118,44,39,97,126,113]},monthly:{labels:['2026.01','2026.02','2026.03','2026.04','2026.05','2026.06','2026.07','2026.08','2026.09','2026.10','2026.11'],values:[312,1523,986,742,1058,1712,481,1124,1095,1368,1241]},yearly:{labels:['2022','2023','2024','2025','2026'],values:[8234,10532,12841,14122,11642]}},current=datasets.monthly;function formatNumber(value){return Number(value).toLocaleString('ko-KR')}function renderChart(){var svg=document.getElementById('loginChart'),wrap=document.getElementById('chartWrap'),labels=current.labels,values=current.values,width=Math.max(760,Math.round(wrap.clientWidth)),height=Math.max(280,Math.round(wrap.clientHeight)),left=58,right=22,top=28,bottom=55,plotW=width-left-right,plotH=height-top-bottom,max=Math.ceil(Math.max.apply(null,values)/500)*500;svg.setAttribute('viewBox','0 0 '+width+' '+height);if(max<200)max=200;var parts=[];for(var i=0;i<=4;i++){var y=top+plotH*i/4,value=Math.round(max*(4-i)/4);parts.push('<line x1="'+left+'" y1="'+y+'" x2="'+(width-right)+'" y2="'+y+'" stroke="#e5e9f0"/><text x="'+(left-12)+'" y="'+(y+4)+'" text-anchor="end" fill="#64748b" font-size="12">'+formatNumber(value)+'</text>')}var points=values.map(function(value,index){var x=labels.length===1?left+plotW/2:left+plotW*index/(labels.length-1),y=top+plotH*(1-value/max);return{x:x,y:y,value:value,label:labels[index]}});parts.push('<polyline points="'+points.map(function(p){return p.x+','+p.y}).join(' ')+'" fill="none" stroke="#1d6ff2" stroke-width="2.5"/>');points.forEach(function(p){parts.push('<line x1="'+p.x+'" y1="'+top+'" x2="'+p.x+'" y2="'+(top+plotH)+'" stroke="#f1f5f9"/>');parts.push('<text x="'+p.x+'" y="'+(height-19)+'" text-anchor="middle" fill="#475569" font-size="12">'+p.label+'</text>');parts.push('<circle class="chart-point" tabindex="0" data-label="'+p.label+'" data-value="'+p.value+'" cx="'+p.x+'" cy="'+p.y+'" r="7" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>')});svg.innerHTML=parts.join('');svg.querySelectorAll('.chart-point').forEach(function(point){function show(){var box=svg.getBoundingClientRect(),view=svg.viewBox.baseVal,scaleX=box.width/view.width,scaleY=box.height/view.height,tooltip=document.getElementById('chartTooltip');tooltip.textContent=point.dataset.label+' · 로그인 횟수 '+formatNumber(point.dataset.value)+'회';tooltip.style.left=(Number(point.getAttribute('cx'))*scaleX)+'px';tooltip.style.top=(Number(point.getAttribute('cy'))*scaleY)+'px';tooltip.hidden=false}point.addEventListener('mouseenter',show);point.addEventListener('focus',show);point.addEventListener('mouseleave',hideTooltip);point.addEventListener('blur',hideTooltip)})}function hideTooltip(){document.getElementById('chartTooltip').hidden=true}function renderTable(){document.getElementById('resultHead').innerHTML='<tr><th>기간</th>'+current.labels.map(function(label){return '<th>'+label+'</th>'}).join('')+'</tr>';document.getElementById('resultBody').innerHTML='<tr><th>로그인 횟수</th>'+current.values.map(function(value){return '<td><a class="value-link" href="#">'+formatNumber(value)+'</a></td>'}).join('')+'</tr>'}function render(){var basis=document.getElementById('basis').value,names={daily:'일별',monthly:'월별',yearly:'연도별'};current=datasets[basis];document.getElementById('chartTitle').textContent=names[basis]+' 로그인 횟수';document.getElementById('periodText').textContent=document.getElementById('startDate').value+' ~ '+document.getElementById('endDate').value;renderChart();renderTable()}
function setDateInputs(type){var start=document.getElementById('startDate'),end=document.getElementById('endDate');if(type==='daily'){start.type='date';end.type='date';start.value='2026-08-10';end.value='2026-08-19'}else if(type==='monthly'){start.type='month';end.type='month';start.value='2026-01';end.value='2026-11'}else{start.type='number';end.type='number';start.min=end.min='2000';start.max=end.max='2100';start.value='2022';end.value='2026'}}document.getElementById('basis').addEventListener('change',function(){setDateInputs(this.value);render()});document.getElementById('searchForm').addEventListener('submit',function(e){e.preventDefault();render();showToast('로그인 현황을 조회했습니다.')});document.getElementById('searchForm').addEventListener('reset',function(){setTimeout(function(){document.getElementById('basis').value='monthly';setDateInputs('monthly');render()},0)});document.getElementById('excel').addEventListener('click',function(){var csv='\ufeff기간,'+current.labels.join(',')+'\n로그인 횟수,'+current.values.join(','),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='로그인_현황.csv';link.click();URL.revokeObjectURL(url);showToast('로그인 현황을 다운로드했습니다.')});function showToast(message){var toast=document.getElementById('toast');toast.textContent=message;toast.hidden=false;setTimeout(function(){toast.hidden=true},1800)}render();
var chartResizeTimer;window.addEventListener('resize',function(){clearTimeout(chartResizeTimer);chartResizeTimer=setTimeout(renderChart,120)});
</script><script src="/assets/pms-lnb.js"></script></body></html>
