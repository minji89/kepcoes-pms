<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>연도별 비교현황 | 사업관리시스템</title>
  <link rel="stylesheet" href="/assets/pms-lnb.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172033;font:14px "Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.layout{display:flex;min-height:100vh}.main{min-width:0;flex:1}.topbar{height:60px;display:flex;align-items:center;gap:14px;padding:0 26px;background:#fff;border-bottom:1px solid #e1e7ef}.topbar h1{margin:0;font-size:19px;color:#172c53}.pms{padding:4px 9px;border-radius:6px;background:#eff6ff;color:#1d6ff2;font-size:12px;font-weight:700}.top-right{margin-left:auto;color:#64748b;font-size:13px}.content{width:100%;max-width:1680px;margin:0 auto;padding:24px 28px 40px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:17px}.page-head h1{margin:0 0 6px;font-size:26px}.page-head p{margin:0;color:#64748b}.breadcrumb{color:#64748b;font-size:13px;white-space:nowrap}.breadcrumb b{color:#1e293b}.panel{background:#fff;border:1px solid #dce3ec;border-radius:8px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
    .filter-panel{padding:20px}.filter-row{display:grid;grid-template-columns:auto minmax(160px,210px) auto 130px auto minmax(130px,160px) minmax(160px,1fr) 90px;gap:10px;align-items:center}.filter-row label{font-weight:700;white-space:nowrap}.control{height:38px;padding:0 11px;border:1px solid #cbd5e1;border-radius:5px;background:#fff;color:#334155;font:inherit}.control:focus{outline:2px solid #bfdbfe;border-color:#2563eb}.chips{display:flex;align-items:center;gap:7px;min-width:0;min-height:38px}.chip{height:34px;display:inline-flex;align-items:center;gap:8px;padding:0 10px;border:1px solid #93c5fd;border-radius:5px;background:#eff6ff;color:#1d4ed8;font-weight:700;white-space:nowrap}.chip button{padding:0;border:0;background:none;color:#64748b;font-size:17px;line-height:1;cursor:pointer}.btn{height:38px;padding:0 20px;border:0;border-radius:5px;font-weight:700;cursor:pointer}.search{background:#1e293b;color:#fff}.filter-actions{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px dashed #cad3df}.guide{margin:0;color:#64748b;font-size:12px}.excel{background:#17853b;color:#fff}.results[hidden]{display:none}.summary-panel{margin-top:12px;padding:16px 18px}.year-block+.year-block{margin-top:18px}.year-block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.year-block-head h2{margin:0;color:#334155;font-size:14px;font-weight:500}.year-block-head h2:before{content:"≡";margin-right:6px;color:#64748b;font-size:12px}.year-block-head small,.summary-date{color:#64748b;font-size:12px;font-weight:400}.table-scroll{overflow-x:auto}.year-table{width:100%;min-width:1000px;border-collapse:collapse;text-align:center;font-size:13px}.year-table th,.year-table td{height:40px;padding:7px;border:1px solid #aeb7c2}.year-table thead th{background:#d9dde2;color:#172033;font-weight:700}.year-table tbody th{background:#fff;font-weight:500}.year-table .year-label{width:105px}.year-table .total{width:95px;font-weight:700}.chart-panel{margin-top:12px;padding:18px 20px 20px}.chart-title{margin:0 0 8px;font-size:16px}.chart-wrap{width:100%;overflow-x:auto}.chart{display:block;width:100%;min-width:900px;height:auto}.grid-line{stroke:#d7dee8;stroke-width:1}.axis-label{fill:#64748b;font-size:12px}.series{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.point{stroke:#fff;stroke-width:2}.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:28px;margin-top:7px}.legend span{display:flex;align-items:center;gap:8px}.legend i{width:25px;height:3px;border-radius:2px;background:var(--color);position:relative}.legend i:after{content:"";position:absolute;left:9px;top:-3px;width:8px;height:8px;border-radius:50%;background:inherit}.toast{position:fixed;right:24px;bottom:24px;padding:12px 17px;border-radius:7px;background:#172033;color:#fff;box-shadow:0 8px 24px rgba(15,23,42,.24);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}
    @media(max-width:1200px){.filter-row{grid-template-columns:auto 1fr auto 1fr}.chips{grid-column:2/4}.search{grid-column:4}}@media(max-width:760px){.content{padding:18px}.page-head,.filter-actions{align-items:flex-start;flex-direction:column;gap:10px}.filter-row{grid-template-columns:1fr}.chips,.search{grid-column:auto}.top-right{display:none}.btn{width:100%}}
  </style>
</head>
<body><div class="layout">
  <aside class="sidebar"><div class="sidebar-head"><div class="logo"><img src="/images/kepco-es-logo.png" alt="KEPCO ES"></div></div><nav class="nav" aria-label="주 메뉴"><ul></ul></nav></aside>
  <main class="main"><header class="topbar"><h1>사업관리시스템</h1><span class="pms">PMS</span><div class="top-right">통계 기준일 : 2026.08.31</div></header>
    <div class="content">
      <div class="page-head"><div><h1>연도별 비교현황</h1><p>선택한 기준에 따라 연도별 월간 실적을 비교합니다.</p></div><div class="breadcrumb">HOME　›　통계　›　<b>연도별 비교현황</b></div></div>
      <section class="panel filter-panel">
        <div class="filter-row">
          <label for="metric">비교 기준</label>
          <select id="metric" class="control"><option value="">선택</option><option value="contract">계약 건수</option><option value="sales">매출</option><option value="nonOperatingIncome">영업외 수익</option><option value="investment">투자금 지급</option><option value="repayment">상환누적액</option><option value="contractType">계약형태</option><option value="businessType">사업 구분</option><option value="equipmentType">대상설비 구분</option></select>
          <label for="base-year">기준 연도</label>
          <select id="base-year" class="control"><option value="2026">2026</option><option value="2025">2025</option><option value="2024">2024</option></select>
          <label for="compare-year">비교 연도</label>
          <select id="compare-year" class="control"><option value="">선택</option><option value="2025">2025</option><option value="2024">2024</option></select>
          <div class="chips" id="chips" aria-live="polite"></div>
          <button type="button" class="btn search" id="search-btn">조회</button>
        </div>
        <div class="filter-actions"><p class="guide">비교 기준을 선택하고 조회하면 월별 비교 결과가 표시됩니다.</p><button type="button" class="btn excel" id="excel-btn" hidden>다운로드(Excel)</button></div>
      </section>

      <div class="results" id="results" hidden>
        <section class="panel summary-panel" id="year-tables"></section>
        <section class="panel chart-panel"><h2 class="chart-title" id="chart-title"></h2><div class="chart-wrap"><svg class="chart" id="year-chart" viewBox="0 0 1200 340" role="img"></svg></div><div class="legend" id="legend"></div></section>
      </div>
    </div>
  </main>
</div><div class="toast" id="toast" role="status" aria-live="polite"></div><script src="/assets/pms-lnb.js"></script><script>
  const metric=document.getElementById('metric'),baseYear=document.getElementById('base-year'),compareYear=document.getElementById('compare-year'),chips=document.getElementById('chips'),results=document.getElementById('results'),excelButton=document.getElementById('excel-btn'),toast=document.getElementById('toast');
  const colors=['#17658a','#f26a2b','#7c3aed'];
  const metricInfo={contract:{label:'계약 건수',unit:'건'},sales:{label:'매출',unit:'백만원'},nonOperatingIncome:{label:'영업외 수익',unit:'백만원'},investment:{label:'투자금 지급',unit:'백만원'},repayment:{label:'상환누적액',unit:'백만원'},contractType:{label:'계약형태',unit:'건'},businessType:{label:'사업 구분',unit:'건'},equipmentType:{label:'대상설비 구분',unit:'건'}};
  const contractData={2026:[21,29,47,38,18,27,null,null,null,null,null,null],2025:[23,23,54,43,13,24,32,14,5,32,18,23],2024:[18,27,31,38,21,29,25,19,16,28,22,20]};
  let searched=false;
  function notify(message){toast.textContent=message;toast.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.classList.remove('show'),2200)}
  function selectedYears(){return Array.from(chips.querySelectorAll('.chip')).map(chip=>chip.dataset.year)}
  function valuesFor(year){const source=contractData[year]||contractData[2024];if(metric.value==='contract')return source;const factor={sales:52,nonOperatingIncome:13,investment:38,repayment:31,contractType:1.18,businessType:1.08,equipmentType:.86}[metric.value]||1;return source.map(value=>value===null?null:Math.round(value*factor))}
  function addCompareYear(year){if(!year||year===baseYear.value||chips.querySelector('[data-year="'+year+'"]'))return;const chip=document.createElement('span');chip.className='chip';chip.dataset.year=year;chip.innerHTML=year+' <button type="button" aria-label="'+year+' 비교 연도 삭제">×</button>';chips.appendChild(chip)}
  function render(){const info=metricInfo[metric.value];if(!info)return;const years=[baseYear.value].concat(selectedYears().filter(year=>year!==baseYear.value));document.getElementById('chart-title').textContent=info.label+' 월별 추이';
    const monthHeaders=Array.from({length:12},(_,index)=>'<th>'+(index+1)+'</th>').join('');
    document.getElementById('year-tables').innerHTML=years.map((year,index)=>{const values=valuesFor(year),total=values.reduce((sum,value)=>sum+(value||0),0),type=index===0?'기준 연도':'비교 연도',date=year==='2026'?'2026.08.31':year+'.12.31';return '<div class="year-block"><div class="year-block-head"><h2>총 '+info.label+'('+type+')</h2><span class="summary-date">조회 기준일자 : '+date+'</span></div><div class="table-scroll"><table class="year-table"><thead><tr><th class="year-label">'+type+'</th><th class="total">총합</th>'+monthHeaders+'</tr></thead><tbody><tr><th>'+year+'</th><td class="total">'+total.toLocaleString('ko-KR')+'</td>'+values.map(value=>'<td>'+(value===null?'':value.toLocaleString('ko-KR'))+'</td>').join('')+'</tr></tbody></table></div></div>'}).join('');
    renderChart(years,info);document.getElementById('legend').innerHTML=years.map((year,index)=>'<span><i style="--color:'+colors[index]+'"></i>'+(index===0?'기준연도 ':'비교연도 ')+year+'년</span>').join('');results.hidden=false;excelButton.hidden=false;
  }
  function renderChart(years,info){const svg=document.getElementById('year-chart'),left=62,right=28,top=25,bottom=48,width=1200,height=340,plotW=width-left-right,plotH=height-top-bottom,all=years.flatMap(year=>valuesFor(year).filter(value=>value!==null)),max=Math.max(10,Math.ceil(Math.max(...all)/10)*10),parts=[];
    for(let index=0;index<=5;index++){const y=top+plotH*index/5,value=Math.round(max*(5-index)/5);parts.push('<line class="grid-line" x1="'+left+'" y1="'+y+'" x2="'+(width-right)+'" y2="'+y+'"/><text class="axis-label" text-anchor="end" x="'+(left-12)+'" y="'+(y+4)+'">'+value.toLocaleString('ko-KR')+'</text>')}
    for(let month=0;month<12;month++){const x=left+plotW*month/11;parts.push('<text class="axis-label" text-anchor="middle" x="'+x+'" y="'+(height-18)+'">'+(month+1)+'월</text>')}
    years.forEach((year,index)=>{const values=valuesFor(year),points=values.map((value,month)=>value===null?null:{x:left+plotW*month/11,y:top+plotH*(1-value/max),value}).filter(Boolean);parts.push('<polyline class="series" stroke="'+colors[index]+'" points="'+points.map(point=>point.x+','+point.y).join(' ')+'"/>');points.forEach(point=>parts.push('<circle class="point" fill="'+colors[index]+'" cx="'+point.x+'" cy="'+point.y+'" r="5"><title>'+year+'년 '+point.value.toLocaleString('ko-KR')+info.unit+'</title></circle>'))});svg.innerHTML=parts.join('');svg.setAttribute('aria-label',years.join('년, ')+'년 '+info.label+' 월별 비교 선 그래프')}
  chips.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;button.closest('.chip').remove();if(searched)render()});
  compareYear.addEventListener('change',()=>{const year=compareYear.value;if(!year)return;if(year===baseYear.value){notify('기준 연도와 다른 연도를 선택해 주세요.')}else{addCompareYear(year);if(searched)render()}compareYear.value=''});
  baseYear.addEventListener('change',()=>{const duplicate=chips.querySelector('[data-year="'+baseYear.value+'"]');if(duplicate)duplicate.remove();if(searched)render()});
  document.getElementById('search-btn').addEventListener('click',()=>{if(!metric.value){metric.focus();notify('비교 기준을 선택해 주세요.');return}searched=true;render();notify(baseYear.value+'년 '+metricInfo[metric.value].label+'을 조회했습니다.')});
  excelButton.addEventListener('click',()=>{const info=metricInfo[metric.value],years=[baseYear.value].concat(selectedYears()),rows=[['구분','총합','1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월']];years.forEach((year,index)=>{const values=valuesFor(year);rows.push([(index?'비교 ':'기준 ')+year,values.reduce((sum,value)=>sum+(value||0),0)].concat(values.map(value=>value===null?'':value)))});const csv='\ufeff'+rows.map(row=>row.join(',')).join('\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='연도별_'+info.label.replaceAll(' ','_')+'.csv';link.click();URL.revokeObjectURL(url);notify('비교현황 파일을 다운로드했습니다.')});
</script></body></html>
