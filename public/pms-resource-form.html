<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자료 등록 | 사업관리시스템(PMS)</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/pms-lnb.css"><style>
:root{--bg:#f1f5f9;--border:#d8dee8;--text:#1e293b;--muted:#64748b;--brand:#1d6ff2;--navy:#334155;--danger:#dc2626}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Noto Sans KR",sans-serif}a{text-decoration:none;color:inherit}ul{list-style:none;margin:0;padding:0}button,input{font:inherit}.layout{display:flex;min-height:100vh}.sidebar{width:248px;flex:0 0 248px;background:#fff;border-right:1px solid var(--border)}.sidebar-head{height:60px;padding:0 20px;display:flex;align-items:center}.logo img{height:30px}.nav{padding:16px 12px}.main{min-width:0;flex:1}.topbar{height:60px;padding:0 26px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--border)}.topbar h1{margin:0;font-size:19px}.pms{padding:4px 9px;border-radius:6px;background:#eff6ff;color:var(--brand);font-size:12px;font-weight:700}.user{margin-left:auto;color:#475569}.content{display:grid;gap:18px;padding:26px}.page-head{display:flex;align-items:flex-end;justify-content:space-between}.page-head h2{margin:0;font-size:25px}.crumb{color:var(--muted);font-size:13px}.card{overflow:hidden;background:#fff;border:1px solid var(--border);border-radius:10px}.grid{display:grid;grid-template-columns:160px 1fr}.label,.field{min-height:54px;padding:10px 16px;border-bottom:1px solid #e5e9f0}.label{display:flex;align-items:center;background:#f8fafc;font-weight:700}.label:before{content:'·';margin-right:7px}.field{display:flex;align-items:center;gap:16px;border-left:1px solid #e5e9f0}.required{color:var(--danger);margin-left:4px}.field input[type=text]{width:min(680px,100%);height:36px;padding:0 11px;border:1px solid #cbd5e1;border-radius:6px}.radio{display:inline-flex;gap:6px}.dates{display:flex;align-items:center;gap:8px}.dates input{height:36px;padding:0 10px;border:1px solid #cbd5e1;border-radius:6px}.editor-wrap{grid-column:1/-1;padding:18px;border-bottom:1px solid #e5e9f0}.toolbar{display:flex;gap:5px;padding:8px;border:1px solid #cbd5e1;border-bottom:0;background:#f8fafc}.tool{height:30px;border:1px solid #cbd5e1;background:#fff}.editor{min-height:260px;padding:18px;border:1px solid #cbd5e1;outline:none}.attachments{display:grid;gap:12px}.drop{width:min(720px,100%);padding:25px;border:1px dashed #93b4ee;border-radius:8px;background:#f8fbff;text-align:center;color:#64748b;cursor:pointer}.drop strong{display:block;color:#334155}.old{display:grid;gap:7px}.remove{border:0;background:none;color:#dc2626;text-decoration:underline;cursor:pointer}.actions{display:flex;align-items:center;margin-top:10px}.right{display:flex;gap:8px;margin-left:auto}.btn{display:inline-flex;align-items:center;justify-content:center;height:36px;min-width:90px;padding:0 16px;border:1px solid var(--navy);border-radius:6px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}.primary{background:var(--brand);border-color:var(--brand)}.light{background:#fff;color:#334155;border-color:#94a3b8}.toast[hidden]{display:none}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:11px 18px;border-radius:999px;background:#0f172a;color:#fff}@media(max-width:900px){.sidebar{display:none}.content{padding:18px}.grid{grid-template-columns:120px 1fr}.field{flex-wrap:wrap}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="sidebar-head"><a class="logo" href="/"><img src="/images/kepco-es-logo.png" alt="켑코이에스 주식회사"></a></div><nav class="nav" aria-label="주 메뉴"><ul></ul></nav></aside><div class="main"><header class="topbar"><h1>사업관리시스템</h1><span class="pms">PMS</span><span class="user"><b>이희성 부장</b> [시스템관리자]</span></header><main class="content"><div class="page-head"><h2 id="heading">자료 등록</h2><div class="crumb">HOME　›　공통 관리　›　양식 등 자료실 관리　›　<b id="crumb">자료 등록</b></div></div><form id="form"><section class="card"><div class="grid"><div class="label">우선노출 <span class="required">*</span></div><div class="field"><label class="radio"><input type="radio" name="priority" value="Y"> Y (우선노출)</label><label class="radio"><input type="radio" name="priority" value="N" checked> N (우선노출 안 함)</label></div><label class="label" for="title">제목 <span class="required">*</span></label><div class="field"><input id="title" type="text" maxlength="100" required></div><div class="label">게시기간 <span class="required">*</span></div><div class="field"><label class="radio"><input id="unlimited" type="radio" name="period" checked> 무관</label><label class="radio"><input id="limited" type="radio" name="period"> 기간 설정</label><div class="dates"><input id="start" type="date" disabled><span>~</span><input id="end" type="date" disabled></div></div><div class="label">사용여부 <span class="required">*</span></div><div class="field"><label class="radio"><input type="radio" name="status" checked> 사용</label><label class="radio"><input type="radio" name="status"> 미사용</label></div><div class="label">작성자 <span class="required">*</span></div><div class="field">이희성</div><div class="editor-wrap"><div class="toolbar"><button class="tool" type="button" data-cmd="bold"><b>B</b></button><button class="tool" type="button" data-cmd="italic"><i>I</i></button><button class="tool" type="button" data-cmd="underline"><u>U</u></button><button class="tool" type="button" data-cmd="insertUnorderedList">목록</button></div><div class="editor" id="editor" contenteditable="true" role="textbox" aria-label="자료 내용"></div></div><div class="label">첨부파일</div><div class="field attachments"><div class="old" id="old" hidden><div>HW_물품계약서.pdf <button class="remove" type="button">삭제</button></div><div>HW_물품계약서.hwp <button class="remove" type="button">삭제</button></div></div><input id="files" type="file" multiple hidden><label class="drop" for="files"><strong>파일을 마우스로 끌어오거나 클릭하여 선택해 주세요.</strong>최대 200MB 이하의 파일을 등록할 수 있습니다.</label><div id="fileNames"></div></div></div></section><div class="actions"><a class="btn light" href="/pms-resource-management.html">목록</a><div class="right"><button class="btn primary" id="save" type="submit">등록</button><button class="btn light" id="cancel" type="button">취소</button></div></div></form></main></div></div><div class="toast" id="toast" hidden></div><script>var edit=new URLSearchParams(location.search).get('mode')==='edit',editor=document.getElementById('editor');if(edit){document.title='자료 수정 | 사업관리시스템(PMS)';document.getElementById('heading').textContent='자료 수정';document.getElementById('crumb').textContent='자료 수정';document.getElementById('save').textContent='수정';document.getElementById('title').value='HW 물품계약서';document.querySelector('[name=priority][value=Y]').checked=true;document.getElementById('limited').checked=true;document.getElementById('start').disabled=false;document.getElementById('end').disabled=false;document.getElementById('start').value='2026-07-01';document.getElementById('end').value='2026-07-31';editor.innerHTML='<h3>HW 물품계약서 양식</h3><p>하드웨어 물품 구매 계약 시 사용하는 표준 계약서 양식입니다.</p>';document.getElementById('old').hidden=false}document.querySelectorAll('[name=period]').forEach(function(r){r.onchange=function(){var on=document.getElementById('limited').checked;document.getElementById('start').disabled=!on;document.getElementById('end').disabled=!on}});document.querySelectorAll('[data-cmd]').forEach(function(b){b.onclick=function(){document.execCommand(b.dataset.cmd)}});document.querySelectorAll('.remove').forEach(function(b){b.onclick=function(){b.parentElement.remove()}});document.getElementById('files').onchange=function(){document.getElementById('fileNames').textContent=Array.from(this.files).map(function(f){return f.name}).join(', ')};document.getElementById('cancel').onclick=function(){history.length>1?history.back():location.href='/pms-resource-management.html'};document.getElementById('form').onsubmit=function(e){e.preventDefault();if(!this.reportValidity())return;if(!editor.textContent.trim()){toast('자료 내용을 입력해 주세요.');editor.focus();return}toast(edit?'자료가 수정되었습니다.':'자료가 등록되었습니다.');setTimeout(function(){location.href=edit?'/pms-resource-view.html':'/pms-resource-management.html'},700)};function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.hidden=false;setTimeout(function(){t.hidden=true},1800)}</script><script src="/assets/pms-lnb.js"></script></body></html>
