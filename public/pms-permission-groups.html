<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>권한 그룹 및 메뉴별 권한 관리 | 사업관리시스템(PMS)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/pms-lnb.css">
  <style>
    :root{--bg:#f1f5f9;--surface:#fff;--border:#d8dee8;--text:#1e293b;--muted:#64748b;--brand:#1d6ff2;--navy:#334155;--green:#16a34a;--danger:#dc2626}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Noto Sans KR",sans-serif}a{color:inherit;text-decoration:none}ul{list-style:none;margin:0;padding:0}button,input,select{font:inherit}.layout{display:flex;min-height:100vh}.sidebar{width:248px;flex:0 0 248px;background:#fff;border-right:1px solid var(--border)}.sidebar-head{height:60px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid var(--border)}.logo img{height:30px}.nav{padding:16px 12px}.main{min-width:0;flex:1}.topbar{height:60px;padding:0 26px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--border)}.topbar h1{margin:0;font-size:19px}.pms{padding:4px 9px;border-radius:6px;background:#eff6ff;color:var(--brand);font-size:12px;font-weight:700}.user{margin-left:auto;color:#475569}.content{display:grid;gap:18px;min-width:0;padding:26px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.page-head h2{margin:0;font-size:25px;letter-spacing:-.03em}.crumb{color:var(--muted);font-size:13px}.card{background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 1px 2px rgba(15,23,42,.04)}.filters{position:relative;display:grid;padding:10px 150px 10px 20px}.filter-row{display:flex;align-items:center;gap:8px;min-height:50px;border-bottom:1px dashed #cbd5e1}.filter-row:last-of-type{border-bottom:0}.filter-row>label{width:96px;flex:none;white-space:nowrap;font-weight:700;color:#334155}.filter-row>label:before{content:'·';margin-right:6px}.ctrl{height:36px;padding:0 12px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#334155}.date{width:140px}.keyword{width:min(460px,55vw)}.quick{height:36px;padding:0 15px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#475569;cursor:pointer}.quick.on{border-color:#93b4ee;background:#eff6ff;color:#1d4ed8}.filter-actions{position:absolute;right:20px;top:50%;display:grid;gap:8px;width:100px;transform:translateY(-50%)}.btn{height:36px;padding:0 16px;border:1px solid var(--navy);border-radius:6px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}.btn-light{border-color:#94a3b8;background:#fff;color:#334155}.btn-primary{border-color:var(--brand);background:var(--brand)}.btn-excel{border-color:var(--green);background:var(--green)}.result-card{padding:18px 20px 22px}.list-tools{display:flex;align-items:center;gap:8px;margin-bottom:12px}.count{color:#475569}.spacer{flex:1}.table-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;min-width:980px;border-collapse:collapse}th,td{height:48px;padding:10px 12px;border-right:1px solid #e5e9f0;border-bottom:1px solid #e5e9f0;text-align:center;white-space:nowrap}th:last-child,td:last-child{border-right:0}th{background:#f1f5f9;color:#334155;font-size:13px}tbody tr:last-child td{border-bottom:0}tbody tr:hover td{background:#f8fbff}.group-link{color:#0969da;text-decoration:underline;font-weight:500}.description{text-align:left}.delete-button{height:30px;padding:0 12px;border:1px solid #cbd5e1;border-radius:5px;background:#f8fafc;color:#475569;cursor:pointer}.delete-button:hover{border-color:#fca5a5;background:#fff1f2;color:#b91c1c}.list-bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:20px}.pagination{display:flex;gap:5px;grid-column:2}.pagination button{min-width:32px;height:32px;border:1px solid #cbd5e1;border-radius:4px;background:#fff;color:#475569;cursor:pointer}.pagination .on{border-color:var(--brand);background:var(--brand);color:#fff}.add-button{grid-column:3;justify-self:end}.empty{height:170px;color:#94a3b8}.toast{position:fixed;left:50%;bottom:30px;z-index:1100;transform:translateX(-50%);padding:11px 18px;border-radius:999px;background:#0f172a;color:#fff}.toast[hidden]{display:none}
    body.modal-open{overflow:hidden}.confirm-modal[hidden]{display:none}.confirm-modal{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:24px;background:rgba(15,23,42,.52)}.confirm-dialog{width:min(520px,100%);border-radius:10px;background:#fff;box-shadow:0 24px 70px rgba(15,23,42,.3)}.modal-head{display:flex;align-items:center;min-height:56px;padding:0 20px;border-bottom:1px solid #dbe3ed;background:#f8fafc}.modal-head h3{margin:0;font-size:18px}.modal-close{margin-left:auto;width:34px;height:34px;border:0;border-radius:6px;background:transparent;color:#64748b;font-size:25px;line-height:1;cursor:pointer}.modal-close:hover{background:#e8eef6;color:#1e293b}.modal-body{padding:22px}.warning-box{display:flex;align-items:flex-start;gap:16px;padding:18px;border:1px solid #fde68a;border-radius:8px;background:#fffbeb}.warning-icon{display:grid;place-items:center;width:44px;height:44px;flex:none;border-radius:50%;background:#fef3c7;color:#d97706;font-size:24px;font-weight:700}.warning-box p{margin:0;color:#475569}.warning-box strong{display:block;margin-bottom:7px;color:#b45309}.warning-box b{color:#1e293b}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.btn-danger{border-color:var(--danger);background:var(--danger)}@media(max-width:900px){.sidebar{display:none}.content{padding:18px}.page-head{align-items:flex-start;flex-direction:column}.filters{padding-right:20px}.filter-actions{position:static;display:flex;width:auto;transform:none}.filter-row{flex-wrap:wrap}.keyword{width:100%}.list-bottom{display:flex;justify-content:center;flex-wrap:wrap}.add-button{margin-left:auto}}
  </style>
</head>
<body>
<div class="layout"><aside class="sidebar"><div class="sidebar-head"><a class="logo" href="/"><img src="/images/kepco-es-logo.png" alt="켑코이에스 주식회사"></a></div><nav class="nav" aria-label="주 메뉴"><ul></ul></nav></aside><div class="main"><header class="topbar"><h1>사업관리시스템</h1><span class="pms">PMS</span><span class="user"><b>이희성 부장</b> [시스템관리자]</span></header><main class="content">
  <div class="page-head"><h2>권한 그룹 및 메뉴별 권한 관리</h2><div class="crumb">HOME　›　공통 관리　›　<b>권한 그룹 및 메뉴별 권한 관리</b></div></div>
  <section class="card" aria-label="검색 조건"><form class="filters" id="searchForm">
    <div class="filter-row"><label>조회기간</label><input class="ctrl date" id="startDate" type="date" value="2025-07-01" aria-label="시작일"><span>~</span><input class="ctrl date" id="endDate" type="date" value="2026-06-30" aria-label="종료일"><button class="quick" type="button" data-days="1">하루 전</button><button class="quick on" type="button" data-months="1">1개월</button><button class="quick" type="button" data-months="3">3개월</button><button class="quick" type="button" data-months="12">1년</button></div>
    <div class="filter-row"><label for="useStatus">사용 여부</label><select class="ctrl" id="useStatus"><option value="">전체</option><option value="사용">사용</option><option value="중지">중지</option></select></div>
    <div class="filter-row"><label for="keyword">키워드 검색</label><select class="ctrl" id="keywordType"><option value="all">전체</option><option value="name">권한그룹명</option><option value="description">권한그룹 설명</option><option value="creator">등록자</option></select><input class="ctrl keyword" id="keyword" placeholder="검색어를 입력하세요."></div>
    <div class="filter-actions"><button class="btn" type="submit">검색</button><button class="btn btn-light" type="reset">초기화</button></div>
  </form></section>
  <section class="card result-card"><div class="list-tools"><span class="count">전체 <b id="count">0</b>건</span><span class="spacer"></span><select class="ctrl" aria-label="페이지당 개수"><option>10개씩</option><option>20개씩</option><option>50개씩</option></select><button class="btn btn-excel" id="excel" type="button">다운로드(Excel)</button></div>
    <div class="table-scroll"><table><thead><tr><th>No</th><th>권한그룹명</th><th>권한그룹 설명</th><th>등록일</th><th>등록자</th><th>최종수정</th><th>매핑(수)</th><th>삭제</th></tr></thead><tbody id="groupBody"></tbody></table></div>
    <div class="list-bottom"><div class="pagination" aria-label="페이지 이동"><button type="button">«</button><button type="button">‹</button><button class="on" type="button">1</button><button type="button">2</button><button type="button">3</button><button type="button">›</button><button type="button">»</button></div><button class="btn add-button" id="addGroup" type="button">권한그룹 추가 +</button></div>
  </section>
</main></div></div>
<div class="confirm-modal" id="deleteModal" role="alertdialog" aria-modal="true" aria-labelledby="deleteTitle" aria-describedby="deleteMessage" hidden><div class="confirm-dialog"><header class="modal-head"><h3 id="deleteTitle">권한그룹 삭제 유의사항</h3><button class="modal-close" type="button" data-delete-close aria-label="닫기">×</button></header><div class="modal-body"><div class="warning-box"><span class="warning-icon" aria-hidden="true">!</span><p id="deleteMessage"><strong>권한그룹을 삭제하면 매핑된 직원들의 권한이 모두 해제됩니다.</strong><b id="deleteGroupName"></b> 그룹을 삭제하시겠습니까?</p></div><div class="modal-actions"><button class="btn btn-danger" id="confirmDelete" type="button">삭제하기</button><button class="btn btn-light" type="button" data-delete-close>취소</button></div></div></div></div>
<div class="toast" id="toast" hidden></div>
<script>
var groups=[
 {no:'25,214',name:'권한그룹명 #1',description:'최고관리자(시스템 운영 담당자)를 대상으로 한 모든 권한',status:'사용',created:'2026. 06. 09',creator:'이희성',updated:'2026.06.10(이희성)',mapping:2},
 {no:'25,213',name:'권한그룹명 #2',description:'사업 담당자를 위한 프로젝트 조회 및 등록 권한',status:'사용',created:'2026. 05. 22',creator:'이희성',updated:'2026.06.01(이희성)',mapping:15},
 {no:'25,212',name:'권한그룹명 #3',description:'조회 전용 권한',status:'중지',created:'2026. 04. 18',creator:'김지윤',updated:'2026.05.20(김지윤)',mapping:4}
],body=document.getElementById('groupBody'),count=document.getElementById('count'),deleteModal=document.getElementById('deleteModal'),pendingDelete=null,lastDeleteTrigger=null;
function render(rows){count.textContent=rows.length;body.innerHTML=rows.length?rows.map(function(g){return '<tr><td>'+g.no+'</td><td><a class="group-link" href="#">'+g.name+'</a></td><td class="description">'+g.description+'</td><td>'+g.created+'</td><td>'+g.creator+'</td><td>'+g.updated+'</td><td>'+g.mapping+'명</td><td><button class="delete-button" type="button" data-group-no="'+g.no+'">삭제</button></td></tr>'}).join(''):'<tr><td class="empty" colspan="8">검색 결과가 없습니다.</td></tr>'}
function filteredGroups(){var status=document.getElementById('useStatus').value,key=document.getElementById('keyword').value.trim().toLowerCase(),type=document.getElementById('keywordType').value;return groups.filter(function(g){var target=type==='all'?Object.values(g).join(' '):g[type]||'';return(!status||g.status===status)&&(!key||String(target).toLowerCase().includes(key))})}function search(){render(filteredGroups())}
document.getElementById('searchForm').addEventListener('submit',function(e){e.preventDefault();search()});document.getElementById('searchForm').addEventListener('reset',function(){setTimeout(function(){document.getElementById('startDate').value='2025-07-01';document.getElementById('endDate').value='2026-06-30';render(groups)},0)});document.querySelectorAll('.quick').forEach(function(btn){btn.addEventListener('click',function(){document.querySelectorAll('.quick').forEach(function(b){b.classList.remove('on')});btn.classList.add('on');var end=new Date(),start=new Date(end);if(btn.dataset.days)start.setDate(start.getDate()-Number(btn.dataset.days));else start.setMonth(start.getMonth()-Number(btn.dataset.months));document.getElementById('endDate').value=end.toISOString().slice(0,10);document.getElementById('startDate').value=start.toISOString().slice(0,10)})});
function openDelete(group,trigger){pendingDelete=group;lastDeleteTrigger=trigger;document.getElementById('deleteGroupName').textContent=group.name;deleteModal.hidden=false;document.body.classList.add('modal-open');document.getElementById('confirmDelete').focus()}function closeDelete(){deleteModal.hidden=true;document.body.classList.remove('modal-open');if(lastDeleteTrigger&&document.body.contains(lastDeleteTrigger))lastDeleteTrigger.focus()}
body.addEventListener('click',function(e){var button=e.target.closest('.delete-button');if(!button)return;var group=groups.find(function(g){return g.no===button.dataset.groupNo});if(group)openDelete(group,button)});document.querySelectorAll('[data-delete-close]').forEach(function(button){button.addEventListener('click',closeDelete)});deleteModal.addEventListener('click',function(e){if(e.target===deleteModal)closeDelete()});document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!deleteModal.hidden)closeDelete()});document.getElementById('confirmDelete').addEventListener('click',function(){if(!pendingDelete)return;var name=pendingDelete.name;groups=groups.filter(function(g){return g.no!==pendingDelete.no});closeDelete();search();showToast(name+'을 삭제했습니다.')});
document.getElementById('addGroup').addEventListener('click',function(){window.location.href='/pms-permission-group-new.html'});document.getElementById('excel').addEventListener('click',function(){var csv='\ufeffNo,권한그룹명,권한그룹 설명,등록일,등록자,최종수정,매핑수\n'+groups.map(function(g){return [g.no,g.name,g.description,g.created,g.creator,g.updated,g.mapping].map(function(v){return '"'+String(v).replaceAll('"','""')+'"'}).join(',')}).join('\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='권한그룹_목록.csv';link.click();URL.revokeObjectURL(url);showToast('권한그룹 목록을 다운로드했습니다.')});function showToast(message){var toast=document.getElementById('toast');toast.textContent=message;toast.hidden=false;setTimeout(function(){toast.hidden=true},2000)}render(groups);
</script><script src="/assets/pms-lnb.js"></script>
</body></html>
