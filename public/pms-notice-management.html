<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>공지사항 관리 | 사업관리시스템(PMS)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/pms-lnb.css">
  <style>
    :root{--bg:#f1f5f9;--surface:#fff;--border:#d8dee8;--text:#1e293b;--muted:#64748b;--brand:#1d6ff2;--navy:#334155}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Noto Sans KR",sans-serif}a{color:inherit;text-decoration:none}ul{list-style:none;margin:0;padding:0}button,input,select,textarea{font:inherit}.layout{display:flex;min-height:100vh}.sidebar{width:248px;flex:0 0 248px;background:#fff;border-right:1px solid var(--border)}.sidebar-head{height:60px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid var(--border)}.logo img{height:30px}.nav{padding:16px 12px}.main{min-width:0;flex:1}.topbar{height:60px;padding:0 26px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--border)}.topbar h1{margin:0;font-size:19px}.pms{padding:4px 9px;border-radius:6px;background:#eff6ff;color:var(--brand);font-size:12px;font-weight:700}.user{margin-left:auto;color:#475569}.content{display:grid;gap:18px;min-width:0;padding:26px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.page-head h2{margin:0;font-size:25px;letter-spacing:-.03em}.crumb{color:var(--muted);font-size:13px}.card{background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 1px 2px rgba(15,23,42,.04)}.filters{position:relative;display:grid;padding:10px 150px 10px 20px}.filter-row{display:flex;align-items:center;gap:8px;min-height:50px;border-bottom:1px dashed #cbd5e1}.filter-row:last-of-type{border-bottom:0}.filter-row>label{width:96px;flex:none;white-space:nowrap;font-weight:700;color:#334155}.filter-row>label:before{content:'·';margin-right:6px}.ctrl{height:36px;padding:0 12px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#334155}.date{width:150px}.type{width:110px}.keyword{width:min(390px,45vw)}.quick{height:36px;padding:0 15px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#475569;cursor:pointer}.quick.on{border-color:#93b4ee;background:#eff6ff;color:#1d4ed8}.filter-actions{position:absolute;right:20px;top:50%;display:grid;gap:8px;width:100px;transform:translateY(-50%)}.btn{height:36px;padding:0 16px;border:1px solid var(--navy);border-radius:6px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}.btn-primary{border-color:var(--brand);background:var(--brand)}.btn-light{border-color:#94a3b8;background:#fff;color:#334155}.result-card{padding:18px 20px 22px}.list-tools{display:flex;align-items:center;gap:8px;margin-bottom:12px}.count{color:#475569}.spacer{flex:1}.table-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;min-width:900px;border-collapse:collapse}th,td{height:48px;padding:10px 12px;border-right:1px solid #e5e9f0;border-bottom:1px solid #e5e9f0;text-align:center;white-space:nowrap}th:last-child,td:last-child{border-right:0}th{background:#f1f5f9;color:#334155;font-size:13px}tbody tr:last-child td{border-bottom:0}tbody tr:hover td{background:#f8fbff}.title-cell{text-align:left}.title-link{color:#0969da;text-decoration:underline}.status{display:inline-flex;min-width:48px;justify-content:center;padding:3px 8px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:700}.status.off{background:#f1f5f9;color:#64748b}.priority{color:#dc2626;font-weight:700}.list-bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:20px}.pagination{display:flex;gap:5px;grid-column:2}.pagination button{min-width:32px;height:32px;border:1px solid #cbd5e1;border-radius:4px;background:#fff;color:#475569;cursor:pointer}.pagination .on{border-color:var(--brand);background:var(--brand);color:#fff}.add-button{grid-column:3;justify-self:end}.modal[hidden],.toast[hidden]{display:none}.modal{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:24px;background:rgba(15,23,42,.52)}.dialog{width:min(680px,100%);border-radius:10px;background:#fff;box-shadow:0 24px 70px rgba(15,23,42,.3)}.modal-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}.modal-head h3{margin:0;font-size:18px}.modal-close{margin-left:auto;border:0;background:transparent;color:#64748b;font-size:25px;cursor:pointer}.notice-form{display:grid;gap:14px;padding:20px}.notice-form label{display:grid;gap:6px;font-weight:700}.notice-form input,.notice-form select,.notice-form textarea{width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:6px;background:#fff}.notice-form textarea{min-height:130px;resize:vertical}.inline-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;left:50%;bottom:30px;z-index:1100;transform:translateX(-50%);padding:11px 18px;border-radius:999px;background:#0f172a;color:#fff}@media(max-width:900px){.sidebar{display:none}.content{padding:18px}.page-head{align-items:flex-start;flex-direction:column}.filters{padding-right:20px}.filter-actions{position:static;display:flex;width:auto;transform:none}.filter-row{flex-wrap:wrap}.keyword{width:100%}.list-bottom{display:flex;justify-content:center;flex-wrap:wrap}.add-button{margin-left:auto}.inline-fields{grid-template-columns:1fr}}
  </style>
</head>
<body><div class="layout"><aside class="sidebar"><div class="sidebar-head"><a class="logo" href="/"><img src="/images/kepco-es-logo.png" alt="켑코이에스 주식회사"></a></div><nav class="nav" aria-label="주 메뉴"><ul></ul></nav></aside><div class="main"><header class="topbar"><h1>사업관리시스템</h1><span class="pms">PMS</span><span class="user"><b>이희성 부장</b> [시스템관리자]</span></header><main class="content">
  <div class="page-head"><h2>공지사항 관리</h2><div class="crumb">HOME　›　공통 관리　›　<b>공지사항 관리</b></div></div>
  <section class="card" aria-label="검색 조건"><form class="filters" id="searchForm"><div class="filter-row"><label>조회기간</label><input class="ctrl date" id="startDate" type="date" value="2025-07-01" aria-label="시작일"><span>~</span><input class="ctrl date" id="endDate" type="date" value="2026-06-30" aria-label="종료일"><button class="quick" type="button" data-days="1">하루 전</button><button class="quick on" type="button" data-months="1">1개월</button><button class="quick" type="button" data-months="3">3개월</button><button class="quick" type="button" data-months="12">1년</button></div><div class="filter-row"><label for="statusFilter">게시 구분</label><select class="ctrl type" id="statusFilter"><option value="all">전체</option><option value="게시">게시</option><option value="미게시">미게시</option></select></div><div class="filter-row"><label for="keyword">키워드 검색</label><select class="ctrl type" id="keywordType"><option value="all">전체</option><option value="title">제목</option><option value="author">작성자</option></select><input class="ctrl keyword" id="keyword" placeholder="검색어를 입력하세요."></div><div class="filter-actions"><button class="btn" type="submit">검색</button><button class="btn btn-light" type="reset">초기화</button></div></form></section>
  <section class="card result-card"><div class="list-tools"><span class="count">전체 <b id="count">0</b>건</span><span class="spacer"></span><select class="ctrl" id="pageSize" aria-label="페이지당 게시물 수"><option value="10">10개씩</option><option value="20">20개씩</option><option value="50">50개씩</option></select></div><div class="table-scroll"><table><thead><tr><th>No</th><th>우선노출</th><th>제목</th><th>게시기간</th><th>작성자</th><th>등록일</th><th>게시여부</th><th>조회수</th></tr></thead><tbody id="noticeBody"></tbody></table></div><div class="list-bottom"><div class="pagination" aria-label="페이지 이동"><button type="button" aria-label="첫 페이지">«</button><button type="button" aria-label="이전 페이지">‹</button><button class="on" type="button">1</button><button type="button">2</button><button type="button">3</button><button type="button" aria-label="다음 페이지">›</button><button type="button" aria-label="마지막 페이지">»</button></div><button class="btn btn-primary add-button" id="addNotice" type="button">공지사항 등록</button></div></section>
</main></div></div>
<div class="modal" id="noticeModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden><div class="dialog"><header class="modal-head"><h3 id="modalTitle">공지사항 등록</h3><button class="modal-close" type="button" data-close aria-label="닫기">×</button></header><form class="notice-form" id="noticeForm"><label>제목 <input id="newTitle" maxlength="100" required placeholder="공지사항 제목을 입력하세요."></label><label>내용 <textarea id="newContent" required placeholder="공지 내용을 입력하세요."></textarea></label><div class="inline-fields"><label>게시 시작일 <input id="newStart" type="date" required value="2026-08-19"></label><label>게시 종료일 <input id="newEnd" type="date" required value="2026-12-31"></label></div><label>우선노출 <select id="newPriority"><option value="N">N</option><option value="Y">Y</option></select></label><div class="modal-actions"><button class="btn btn-primary" type="submit">저장</button><button class="btn btn-light" type="button" data-close>취소</button></div></form></div></div><div class="toast" id="toast" hidden></div>
<script>
var notices=[{no:'25,215',priority:'Y',title:'협력업체 선정 세부기준이 개정되었습니다.',period:'무관',author:'이희성',created:'2026.06.30',status:'게시',views:10235},{no:'25,214',priority:'Y',title:'2026년 하반기 시스템 정기 점검 안내',period:'2026.07.01 ~ 2026.07.31',author:'관리자',created:'2026.06.28',status:'미게시',views:824},{no:'25,213',priority:'N',title:'개인정보 처리방침 변경 안내',period:'무관',author:'이희성',created:'2026.06.20',status:'게시',views:1260},{no:'25,212',priority:'N',title:'PMS 사용자 매뉴얼 업데이트 안내',period:'무관',author:'관리자',created:'2026.06.15',status:'게시',views:952},{no:'25,211',priority:'N',title:'시스템 이용 시 유의사항 안내',period:'무관',author:'이희성',created:'2026.06.10',status:'게시',views:741}],body=document.getElementById('noticeBody');
function render(rows){document.getElementById('count').textContent=rows.length;body.innerHTML=rows.length?rows.map(function(item){return '<tr><td>'+item.no+'</td><td class="'+(item.priority==='Y'?'priority':'')+'">'+item.priority+'</td><td class="title-cell"><a class="title-link" href="/pms-notice-view.html?no='+encodeURIComponent(item.no)+'">'+item.title+'</a></td><td>'+item.period+'</td><td>'+item.author+'</td><td>'+item.created+'</td><td><span class="status '+(item.status==='미게시'?'off':'')+'">'+item.status+'</span></td><td>'+Number(item.views).toLocaleString('ko-KR')+'</td></tr>'}).join(''):'<tr><td colspan="8">검색 결과가 없습니다.</td></tr>'}
function search(){var key=document.getElementById('keyword').value.trim().toLowerCase(),type=document.getElementById('keywordType').value,status=document.getElementById('statusFilter').value;render(notices.filter(function(item){var target=type==='all'?(item.title+' '+item.author):item[type];return(status==='all'||item.status===status)&&(!key||target.toLowerCase().includes(key))}))}document.getElementById('searchForm').addEventListener('submit',function(e){e.preventDefault();search()});document.getElementById('searchForm').addEventListener('reset',function(){setTimeout(function(){document.getElementById('startDate').value='2025-07-01';document.getElementById('endDate').value='2026-06-30';render(notices)},0)});document.querySelectorAll('.quick').forEach(function(btn){btn.addEventListener('click',function(){document.querySelectorAll('.quick').forEach(function(item){item.classList.remove('on')});btn.classList.add('on');var end=new Date(),start=new Date(end);if(btn.dataset.days)start.setDate(start.getDate()-Number(btn.dataset.days));else start.setMonth(start.getMonth()-Number(btn.dataset.months));document.getElementById('endDate').value=end.toISOString().slice(0,10);document.getElementById('startDate').value=start.toISOString().slice(0,10)})});var modal=document.getElementById('noticeModal');function setModal(open){modal.hidden=!open;if(open)document.getElementById('newTitle').focus()}document.getElementById('addNotice').addEventListener('click',function(){setModal(true)});document.querySelectorAll('[data-close]').forEach(function(button){button.addEventListener('click',function(){setModal(false)})});modal.addEventListener('click',function(e){if(e.target===modal)setModal(false)});document.getElementById('noticeForm').addEventListener('submit',function(e){e.preventDefault();if(!this.reportValidity())return;notices.unshift({no:'25,'+(216+notices.length),priority:document.getElementById('newPriority').value,title:document.getElementById('newTitle').value.trim(),period:document.getElementById('newStart').value+' ~ '+document.getElementById('newEnd').value,author:'이희성',created:'2026.08.19',status:'게시',views:0});setModal(false);this.reset();render(notices);var toast=document.getElementById('toast');toast.textContent='공지사항이 등록되었습니다.';toast.hidden=false;setTimeout(function(){toast.hidden=true},1800)});render(notices);
</script><script>document.getElementById('noticeModal').remove();document.getElementById('addNotice').addEventListener('click',function(event){event.stopImmediatePropagation();location.href='/pms-notice-form.html'},true)</script><script src="/assets/pms-lnb.js"></script></body></html>
