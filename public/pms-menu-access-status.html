<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>메뉴별 접속현황 | 사업관리시스템(PMS)</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/pms-lnb.css"><style>
  :root{--bg:#f1f5f9;--surface:#fff;--border:#d8dee8;--text:#1e293b;--muted:#64748b;--brand:#1d6ff2;--navy:#334155;--green:#16a34a}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Noto Sans KR",sans-serif}a{color:inherit;text-decoration:none}ul{list-style:none;margin:0;padding:0}button,input{font:inherit}.layout{display:flex;min-height:100vh}.sidebar{width:248px;flex:0 0 248px;background:#fff;border-right:1px solid var(--border)}.sidebar-head{height:60px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid var(--border)}.logo img{height:30px}.nav{padding:16px 12px}.main{min-width:0;flex:1}.topbar{height:60px;padding:0 26px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--border)}.topbar h1{margin:0;font-size:19px}.pms{padding:4px 9px;border-radius:6px;background:#eff6ff;color:var(--brand);font-size:12px;font-weight:700}.user{margin-left:auto;color:#475569}.content{display:grid;gap:18px;min-width:0;padding:26px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.page-head h2{margin:0;font-size:25px;letter-spacing:-.03em}.crumb{color:var(--muted);font-size:13px}.card{background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 1px 2px rgba(15,23,42,.04)}.filters{position:relative;display:flex;align-items:center;gap:8px;min-height:72px;padding:12px 175px 12px 20px}.filters>label{width:96px;flex:none;white-space:nowrap;font-weight:700;color:#334155}.filters>label:before{content:'·';margin-right:6px}.ctrl{height:36px;padding:0 12px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#334155}.date{width:150px}.quick{height:36px;padding:0 15px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#475569;cursor:pointer}.quick.on{border-color:#93b4ee;background:#eff6ff;color:#1d4ed8}.filter-actions{position:absolute;right:20px;display:flex;gap:8px}.btn{height:36px;padding:0 16px;border:1px solid var(--navy);border-radius:6px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}.btn-light{border-color:#94a3b8;background:#fff;color:#334155}.result-card{padding:18px 20px 22px}.result-summary{display:flex;align-items:center;margin-bottom:11px;color:#475569}.result-summary strong{margin:0 4px;color:var(--brand)}.table-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;min-width:900px;border-collapse:collapse}th,td{height:48px;padding:10px 14px;border-right:1px solid #e5e9f0;border-bottom:1px solid #e5e9f0;white-space:nowrap}th:last-child,td:last-child{border-right:0}thead th{background:#f1f5f9;color:#334155;font-size:13px;text-align:center}tbody tr:last-child td{border-bottom:0}tbody tr:hover td{background:#f8fbff}.depth-cell{color:#334155}.depth-child{padding-left:28px;color:#475569}.depth-child:before{content:'└';margin-right:9px;color:#94a3b8}.count-cell{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}.report-actions{display:flex;justify-content:flex-end;margin-top:12px}.btn-excel{border-color:var(--green);background:var(--green)}.toast{position:fixed;left:50%;bottom:30px;z-index:1000;transform:translateX(-50%);padding:11px 18px;border-radius:999px;background:#0f172a;color:#fff}.toast[hidden]{display:none}@media(max-width:1050px){.filters{align-items:flex-start;flex-wrap:wrap;padding-right:20px}.filter-actions{position:static;width:100%;justify-content:flex-end}}@media(max-width:900px){.sidebar{display:none}.content{padding:18px}.page-head{align-items:flex-start;flex-direction:column}.filters>label{width:100%}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="sidebar-head"><a class="logo" href="/"><img src="/images/kepco-es-logo.png" alt="켑코이에스 주식회사"></a></div><nav class="nav" aria-label="주 메뉴"><ul></ul></nav></aside><div class="main"><header class="topbar"><h1>사업관리시스템</h1><span class="pms">PMS</span><span class="user"><b>이희성 부장</b> [시스템관리자]</span></header><main class="content"><div class="page-head"><h2>메뉴별 접속현황</h2><div class="crumb">HOME　›　공통 관리　›　<b>메뉴별 접속현황</b></div></div>
  <section class="card" aria-label="검색 조건"><form class="filters" id="searchForm"><label>조회기간</label><input class="ctrl date" id="startDate" type="date" value="2025-07-01" aria-label="시작일"><span>~</span><input class="ctrl date" id="endDate" type="date" value="2026-06-30" aria-label="종료일"><button class="quick" type="button" data-days="1">하루 전</button><button class="quick on" type="button" data-months="1">1개월</button><button class="quick" type="button" data-months="3">3개월</button><button class="quick" type="button" data-months="12">1년</button><div class="filter-actions"><button class="btn" type="submit">검색</button><button class="btn btn-light" type="reset">초기화</button></div></form></section>
  <section class="card result-card"><div class="result-summary">조회 메뉴 <strong id="menuCount">0</strong>개 · 총 접속 <strong id="totalCount">0</strong>회</div><div class="table-scroll"><table><thead><tr><th style="width:29%">대메뉴(1Depth)</th><th style="width:29%">중메뉴(2Depth)</th><th style="width:29%">소메뉴(3Depth)</th><th>메뉴 접속 횟수</th></tr></thead><tbody id="accessBody"></tbody></table></div><div class="report-actions"><button class="btn btn-excel" id="excel" type="button">다운로드(Excel)</button></div></section>
</main></div></div><div class="toast" id="toast" hidden></div><script>
var accessRows=[{depth1:'사업 접수',depth2:'신규 프로젝트 등록',depth3:'',count:16528},{depth1:'',depth2:'추진단계 프로젝트 현황',depth3:'',count:12480},{depth1:'프로젝트 관리',depth2:'프로젝트 현황',depth3:'프로젝트 상세',count:18942},{depth1:'',depth2:'',depth3:'추진 정보',count:9367},{depth1:'계약 관리',depth2:'수주계약 현황',depth3:'',count:11024},{depth1:'',depth2:'발주계약 현황',depth3:'',count:8951},{depth1:'자금 관리',depth2:'상환 계획',depth3:'',count:6342},{depth1:'',depth2:'상환 현황',depth3:'',count:7850},{depth1:'',depth2:'투자금 지급현황',depth3:'',count:9241},{depth1:'공통 관리',depth2:'관리자 관리',depth3:'',count:2148},{depth1:'',depth2:'로그인 현황',depth3:'',count:3912},{depth1:'',depth2:'메뉴별 접속현황',depth3:'',count:2725}],body=document.getElementById('accessBody');function format(value){return Number(value).toLocaleString('ko-KR')}function render(rows){body.innerHTML=rows.map(function(row){return '<tr><td class="'+(row.depth1?'depth-cell':'depth-child')+'">'+(row.depth1||'')+'</td><td class="'+(row.depth2?'depth-cell':'depth-child')+'">'+(row.depth2||'')+'</td><td class="'+(row.depth3?'depth-cell':'')+'">'+row.depth3+'</td><td class="count-cell">'+format(row.count)+'</td></tr>'}).join('');document.getElementById('menuCount').textContent=rows.length;document.getElementById('totalCount').textContent=format(rows.reduce(function(sum,row){return sum+row.count},0))}document.querySelectorAll('.quick').forEach(function(button){button.addEventListener('click',function(){document.querySelectorAll('.quick').forEach(function(item){item.classList.remove('on')});button.classList.add('on');var end=new Date(),start=new Date(end);if(button.dataset.days)start.setDate(start.getDate()-Number(button.dataset.days));else start.setMonth(start.getMonth()-Number(button.dataset.months));document.getElementById('endDate').value=end.toISOString().slice(0,10);document.getElementById('startDate').value=start.toISOString().slice(0,10)})});document.getElementById('searchForm').addEventListener('submit',function(e){e.preventDefault();render(accessRows);showToast('메뉴별 접속현황을 조회했습니다.')});document.getElementById('searchForm').addEventListener('reset',function(){setTimeout(function(){document.getElementById('startDate').value='2025-07-01';document.getElementById('endDate').value='2026-06-30';document.querySelectorAll('.quick').forEach(function(item){item.classList.toggle('on',item.dataset.months==='1')});render(accessRows)},0)});document.getElementById('excel').addEventListener('click',function(){var csv='\ufeff대메뉴(1Depth),중메뉴(2Depth),소메뉴(3Depth),메뉴 접속 횟수\n'+accessRows.map(function(row){return [row.depth1,row.depth2,row.depth3,row.count].map(function(value){return '"'+String(value).replaceAll('"','""')+'"'}).join(',')}).join('\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='메뉴별_접속현황.csv';link.click();URL.revokeObjectURL(url);showToast('메뉴별 접속현황을 다운로드했습니다.')});function showToast(message){var toast=document.getElementById('toast');toast.textContent=message;toast.hidden=false;setTimeout(function(){toast.hidden=true},1800)}render(accessRows);
</script><script src="/assets/pms-lnb.js"></script></body></html>
