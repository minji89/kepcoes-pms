<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 정보 수정 | 사업관리시스템(PMS)</title><link rel="stylesheet" href="/assets/pms-lnb.css"><style>
:root{--bg:#f1f5f9;--surface:#fff;--border:#d8dee8;--text:#1e293b;--muted:#64748b;--brand:#1d6ff2;--navy:#334155}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}ul{list-style:none;margin:0;padding:0}.layout{display:flex;min-height:100vh}.sidebar{width:248px;flex:0 0 248px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column}.sidebar-head{height:60px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid var(--border)}.logo img{height:30px}.nav{padding:16px 12px;flex:1}.main{min-width:0;flex:1}.topbar{height:60px;padding:0 26px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--border)}.topbar h1{margin:0;font-size:19px}.pms{padding:4px 9px;border-radius:6px;background:#eff6ff;color:var(--brand);font-size:12px;font-weight:700}.user{margin-left:auto;color:#475569}.content{padding:26px;display:grid;gap:18px}.page-head{display:flex;align-items:center;justify-content:space-between}.page-head h2{margin:0;font-size:25px}.crumb{color:var(--muted);font-size:13px}.card{min-height:360px;display:grid;place-items:center;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 1px 2px rgba(15,23,42,.04)}.verify,.change-form{width:min(560px,calc(100% - 40px))}.verify-title,.field-title{margin:0 0 8px;font-size:15px}.password-row{display:flex;gap:8px}.password-row input,.change-form input{height:40px;min-width:0;flex:1;padding:0 12px;border:1px solid #cbd5e1;border-radius:6px;font:inherit}.btn{height:40px;padding:0 22px;border:0;border-radius:6px;background:var(--navy);color:#fff;font:inherit;font-weight:700;cursor:pointer}.notes{margin:42px 0 16px;color:#475569;font-size:13px}.reset-wrap,.save-wrap{text-align:center}.btn-reset{background:#64748b}.message{min-height:21px;margin-top:8px;color:#dc2626;font-size:12.5px}.change-form[hidden],.verify[hidden],.reset-modal[hidden]{display:none}.change-group{margin-bottom:24px}.change-group input{display:block;width:100%;margin-top:8px}.save-wrap{padding-top:18px;border-top:1px solid var(--border)}.reset-modal{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:24px;background:rgba(15,23,42,.45)}.reset-dialog{width:min(420px,100%);padding:30px 28px 24px;text-align:center;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 20px 60px rgba(15,23,42,.22)}.reset-dialog p{margin:0 0 22px;color:#334155;line-height:1.65}.reset-dialog .btn{min-width:92px}@media(max-width:900px){.sidebar{display:none}.content{padding:18px}.page-head{align-items:flex-start;gap:8px;flex-direction:column}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="sidebar-head"><a class="logo" href="/"><img src="/images/kepco-es-logo.png" alt="켑코이에스 주식회사"></a></div><nav class="nav" aria-label="주 메뉴"><ul></ul></nav></aside><div class="main"><header class="topbar"><h1>사업관리시스템</h1><span class="pms">PMS</span><span class="user"><b>이희성 부장</b> [시스템관리자]</span></header><main class="content"><div class="page-head"><h2>내 정보 수정</h2><div class="crumb">HOME　›　마이페이지　›　<b>내 정보 수정</b></div></div><section class="card"><form class="verify" id="verifyForm"><h3 class="verify-title"><label for="password">현재 비밀번호를 입력하세요</label></h3><div class="password-row"><input id="password" type="password" autocomplete="current-password" required><button class="btn" type="submit">확인</button></div><div class="message" id="message" aria-live="polite"></div><div class="notes">* PMS 로그인을 위해 사용하는 비밀번호를 확인합니다.<br>* 비밀번호를 잊으신 경우, 이 메일을 통한 재발급을 통해 임시 비밀번호를 발급받으실 수 있습니다.</div><div class="reset-wrap"><button class="btn btn-reset" type="button" id="resetPassword">비밀번호 재발행</button></div></form><form class="change-form" id="changeForm" hidden><div class="change-group"><h3 class="field-title"><label for="currentPassword">기존 비밀번호를 입력하세요</label></h3><input id="currentPassword" type="password" autocomplete="current-password" required></div><div class="change-group"><h3 class="field-title"><label for="newPassword">변경할 비밀번호를 입력하세요</label></h3><input id="newPassword" type="password" autocomplete="new-password" placeholder="영문 대/소문자, 숫자 포함 8자리 이상 입력하세요" required><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="변경할 비밀번호를 한번 더 입력해 주세요" required><div class="message" id="changeMessage" aria-live="polite"></div></div><div class="save-wrap"><button class="btn btn-reset" type="submit">비밀번호 저장</button></div></form></section></main></div></div><div class="reset-modal" id="resetModal" role="dialog" aria-modal="true" aria-labelledby="resetMessage" hidden><div class="reset-dialog"><p id="resetMessage">등록된 KEPCOES 계정의 이메일로 임시 비밀번호가 발급되었습니다.<br>임시 비밀번호로 로그인 후 비밀번호를 변경해 주세요.</p><button class="btn" type="button" id="closeResetModal">확인</button></div></div><script>var verifyForm=document.getElementById("verifyForm"),changeForm=document.getElementById("changeForm"),resetModal=document.getElementById("resetModal");verifyForm.addEventListener("submit",function(e){e.preventDefault();if(!this.reportValidity())return;verifyForm.hidden=true;changeForm.hidden=false;document.getElementById("currentPassword").focus()});document.getElementById("resetPassword").addEventListener("click",function(){resetModal.hidden=false;document.getElementById("closeResetModal").focus()});document.getElementById("closeResetModal").addEventListener("click",function(){resetModal.hidden=true;document.getElementById("resetPassword").focus()});resetModal.addEventListener("click",function(e){if(e.target===resetModal)document.getElementById("closeResetModal").click()});changeForm.addEventListener("submit",function(e){e.preventDefault();var next=document.getElementById("newPassword").value,confirm=document.getElementById("confirmPassword").value,message=document.getElementById("changeMessage");if(next!==confirm){message.textContent="비밀번호가 일치하지 않습니다.";return}message.textContent="";alert("정상적으로 비밀번호가 변경되었습니다. 다시 로그인 해 주세요")});</script><script src="/assets/pms-lnb.js"></script></body></html>
