<style>
:root{--bg:#f1f5f9;--surface:#fff;--border:#d8dee8;--text:#1e293b;--muted:#64748b;--brand:#1d6ff2;--navy:#1e3a5f}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Noto Sans KR",sans-serif}a{color:inherit;text-decoration:none}ul{list-style:none;margin:0;padding:0}.layout{display:flex;min-height:100vh}.sidebar{width:248px;flex:0 0 248px;background:#fff;border-right:1px solid var(--border)}.sidebar-head{height:60px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid var(--border)}.logo img{height:30px}.nav{padding:16px 12px}.nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;color:#475569}.nav-icon{width:20px;height:20px}.chev{margin-left:auto}.main{flex:1;min-width:0}.topbar{height:60px;padding:0 26px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--border)}.topbar h1{font-size:19px}.pms{padding:4px 9px;border-radius:6px;background:#eff6ff;color:var(--brand);font-size:12px;font-weight:700}.user{margin-left:auto;color:#475569}.content{padding:26px;display:grid;gap:18px}.page-head{display:flex;align-items:center;justify-content:space-between}.page-head h2{margin:0;font-size:25px}.crumb{color:var(--muted);font-size:13px}.card{background:#fff;border:1px solid var(--border);border-radius:10px}.card-body{padding:20px 24px}.filters{display:grid;grid-template-columns:1fr auto;gap:10px 18px}.filter-row{display:flex;align-items:center;gap:8px;min-width:0}.filter-row label{width:82px;font-weight:700}.filter-row input,.filter-row select,.filter-row button{height:34px;padding:0 10px;border:1px solid #cbd5e1;background:#fff;font:inherit}.filter-row input[type=text]{min-width:300px}.quick.on{background:#334155;color:#fff}.filter-actions{grid-row:1/span 2;grid-column:2;display:grid;gap:8px;align-content:center}.btn{height:36px;padding:0 16px;border:1px solid #cbd5e1;background:#fff;font:inherit;font-weight:700;cursor:pointer}.btn-dark{background:#334155;color:#fff;border-color:#334155}.list-head{display:flex;align-items:center;margin-bottom:10px}.list-head .count{color:#475569}.list-head .spacer{flex:1}.table-scroll{overflow-x:auto;border:1px solid var(--border)}table{width:100%;min-width:1080px;border-collapse:collapse}th,td{padding:12px 10px;border:1px solid var(--border);text-align:center;white-space:nowrap}th{background:#e2e8f0;font-size:12.5px}td{font-size:13px}.cell-project{text-align:left}.state{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700}.state-request{background:#fff7ed;color:#c2410c}.state-done{background:#dcfce7;color:#15803d}.pagination{display:flex;justify-content:center;gap:6px;margin-top:18px}.pagination button{width:34px;height:32px;border:1px solid #cbd5e1;background:#fff}.pagination .on{background:#334155;color:#fff}.modal-overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(15,23,42,.48)}.modal-overlay[hidden]{display:none}.modal{width:100%;max-width:680px;background:#fff;border-radius:12px;box-shadow:0 20px 48px rgba(15,23,42,.28)}.modal-head,.modal-foot{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}.modal-head h3{margin:0}.modal-close{margin-left:auto;border:0;background:none;font-size:22px}.modal-body{padding:20px;display:grid;gap:14px}.field{display:grid;grid-template-columns:140px minmax(0,1fr);align-items:center}.field label{font-weight:700}.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid #cbd5e1;font:inherit}.field textarea{min-height:110px;resize:vertical}.modal-foot{justify-content:flex-end;gap:8px;border-top:1px solid var(--border);border-bottom:0}.req{color:#dc2626}.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);padding:11px 18px;border-radius:999px;background:#0f172a;color:#fff}.toast[hidden]{display:none}@media(max-width:900px){.sidebar{display:none}.content{padding:18px}.page-head{align-items:flex-start;flex-direction:column}.filters{grid-template-columns:1fr}.filter-actions{grid-row:auto;grid-column:auto;display:flex}.filter-row{flex-wrap:wrap}.filter-row input[type=text]{min-width:0;flex:1}}
.request-modal{max-width:540px;border-radius:8px}.request-body{padding:8px 12px;gap:8px}.request-fields{display:grid;grid-template-columns:92px minmax(0,1fr);border:1px solid var(--border);background:var(--border);gap:1px}.request-label{display:flex;align-items:center;justify-content:center;padding:9px 8px;background:#eef2f7;font-weight:700}.request-value{display:flex;align-items:center;gap:7px;padding:7px;background:#fff}.request-value input,.request-value select{width:100%;min-width:0;height:34px;padding:0 9px;border:1px solid #cbd5e1;background:#fff;font:inherit}.request-reason{width:100%;min-height:118px;padding:10px;border:1px solid #cbd5e1;font:inherit;resize:vertical}.request-foot{justify-content:center;border-top:0;padding-top:4px}.request-foot .btn{min-width:82px}
</style><link rel="stylesheet" href="/assets/pms-lnb.css" /></head>
<body><div class="layout"><aside class="sidebar"><div class="sidebar-head"><a class="logo" href="/"><img src="/images/kepco-es-logo.png" alt="켑코이에스 주식회사" /></a></div><nav class="nav" aria-label="주 메뉴"><ul></ul></nav></aside><div class="main"><header class="topbar"><h1>사업관리시스템</h1><span class="pms">PMS</span><span class="user"><b>이희성 부장</b> [시스템관리자]</span></header>
<main class="content"><div class="page-head"><h2>데이터 수정요청</h2><div class="crumb">HOME　›　마이페이지　›　<b>데이터 수정요청</b></div></div>
<section class="card" aria-label="검색 조건"><div class="card-body filters"><div class="filter-row"><label for="dateType">조회기간</label><select id="dateType"><option>등록일</option><option>처리일</option></select><input value="2026.07.01" aria-label="시작일" /><span>~</span><input value="2026.07.30" aria-label="종료일" /><button>하루 전</button><button class="quick on">1개월</button><button class="quick">3개월</button><button class="quick">1년</button></div><div class="filter-row"><label for="keyword">키워드 검색</label><input type="text" id="keyword" placeholder="검색어를 입력하세요." /></div><div class="filter-actions"><button class="btn btn-dark" data-search>검색</button><button class="btn" data-reset>초기화</button></div></div></section>
<section class="card" aria-labelledby="requestListTitle"><div class="card-body"><div class="list-head"><span class="count">조회 결과 : <b id="resultCount">24</b>건</span><span class="spacer"></span><button class="btn btn-dark" data-register>수정요청 등록 +</button></div><div class="table-scroll"><table><caption id="requestListTitle">데이터 수정요청 목록</caption><thead><tr><th>순번</th><th>상태</th><th>프로젝트 번호</th><th>프로젝트명</th><th>진행상태</th><th>요청 영역</th><th>위치</th><th>접수일</th><th>처리일</th><th>처리자</th></tr></thead><tbody id="requestBody"></tbody></table></div><div class="pagination"><button>‹</button><button class="on">1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>›</button></div></div></section></main></div></div>
<div class="modal-overlay" id="registerModal" hidden><div class="modal request-modal" role="dialog" aria-modal="true" aria-labelledby="registerTitle"><div class="modal-head"><h3 id="registerTitle">정보 수정 요청</h3></div><form id="requestForm" class="modal-body request-body"><div class="request-fields"><div class="request-label">위치</div><div class="request-value"><select id="locationDepth1" aria-label="1차 위치"><option>메뉴</option></select><select id="locationDepth2" aria-label="2차 위치"><option>메뉴</option></select><select id="locationDepth3" aria-label="3차 위치"><option>메뉴</option></select></div><label class="request-label" for="area">요청 영역</label><div class="request-value"><input id="area" /></div></div><textarea class="request-reason" id="reason" aria-label="요청 사항 및 사유" placeholder="요청 사항 및 사유를 자세히 입력해 주세요."></textarea></form><div class="modal-foot request-foot"><button class="btn btn-dark" type="submit" form="requestForm">요청</button><button class="btn" data-close>취소</button></div></div></div><div class="toast" id="toast" hidden></div>
<script>(function(){var requests=[{no:24,state:"요청",projectNo:"2026-05011",name:"천안 ㈜선영 LED 에너지효율화사업",progress:"심의요청",area:"사업명",location:"프로젝트관리 > 추진 > 프로젝트 기본정보",received:"2026.12.12",processed:"-",manager:"홍길동"},{no:23,state:"처리완료",projectNo:"2026-05011",name:"천안 ㈜선영 LED 에너지효율화사업",progress:"심의요청",area:"사업명",location:"프로젝트관리 > 추진 > 프로젝트 기본정보",received:"2026.12.12",processed:"2026.12.12",manager:"홍길동"}];for(var i=22;i>=15;i--)requests.push(Object.assign({},requests[1],{no:i}));function render(rows){var body=document.getElementById("requestBody");body.innerHTML="";rows.forEach(function(r){var tr=document.createElement("tr");tr.innerHTML="<td>"+r.no+"</td><td><span class=\"state "+(r.state==="요청"?"state-request":"state-done")+"\">"+r.state+"</span></td><td>"+r.projectNo+"</td><td class=\"cell-project\">"+r.name+"</td><td>"+r.progress+"</td><td>"+r.area+"</td><td>"+r.location+"</td><td>"+r.received+"</td><td>"+r.processed+"</td><td>"+r.manager+"</td>";body.appendChild(tr)});document.getElementById("resultCount").textContent=rows.length}function modal(open){document.getElementById("registerModal").hidden=!open}function toast(msg){var el=document.getElementById("toast");el.textContent=msg;el.hidden=false;setTimeout(function(){el.hidden=true},2200)}document.querySelector("[data-register]").onclick=function(){document.getElementById("requestForm").reset();modal(true)};document.querySelectorAll("[data-close]").forEach(function(b){b.onclick=function(e){e.preventDefault();modal(false)}});document.getElementById("requestForm").onsubmit=function(e){e.preventDefault();if(!this.reportValidity())return;modal(false);toast("데이터 수정요청이 등록되었습니다.")};document.querySelector("[data-search]").onclick=function(){var q=document.getElementById("keyword").value.trim();render(q?requests.filter(function(r){return(r.name+r.projectNo+r.area+r.location).includes(q)}):requests)};document.querySelector("[data-reset]").onclick=function(){document.getElementById("keyword").value="";render(requests)};document.querySelectorAll(".quick").forEach(function(b){b.onclick=function(){document.querySelectorAll(".quick").forEach(function(x){x.classList.remove("on")});b.classList.add("on")}});render(requests)})();</script><script src="/assets/pms-lnb.js"></script></body></html>
