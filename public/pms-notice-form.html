<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공지사항 등록 | 사업관리시스템(PMS)</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/pms-lnb.css"><style>
:root{--bg:#f1f5f9;--surface:#fff;--border:#d8dee8;--text:#1e293b;--muted:#64748b;--brand:#1d6ff2;--navy:#334155;--danger:#dc2626}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Noto Sans KR",sans-serif}a{color:inherit;text-decoration:none}ul{list-style:none;margin:0;padding:0}button,input{font:inherit}.layout{display:flex;min-height:100vh}.sidebar{width:248px;flex:0 0 248px;background:#fff;border-right:1px solid var(--border)}.sidebar-head حالة{height:60px}.sidebar-head{height:60px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid var(--border)}.logo img{height:30px}.nav{padding:16px 12px}.main{min-width:0;flex:1}.topbar{height:60px;padding:0 26px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--border)}.topbar h1{margin:0;font-size:19px}.pms{padding:4px 9px;border-radius:6px;background:#eff6ff;color:var(--brand);font-size:12px;font-weight:700}.user{margin-left:auto;color:#475569}.content{display:grid;gap:18px;min-width:0;padding:26px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.page-head h2{margin:0;font-size:25px;letter-spacing:-.03em}.crumb{color:var(--muted);font-size:13px}.card{overflow:hidden;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 1px 2px rgba(15,23,42,.04)}.form-grid{display:grid;grid-template-columns:160px minmax(0,1fr)}.field-label,.field{min-height:54px;padding:10px 16px;border-bottom:1px solid #e5e9f0}.field-label{display:flex;align-items:center;background:#f8fafc;color:#334155;font-weight:700}.field-label:before{content:'·';margin-right:7px}.field{display:flex;align-items:center;gap:16px;border-left:1px solid #e5e9f0}.requiredXd{color:var(--danger);margin-left:4px}.field input[type=text]{width:min(680px,100%);height:36px;padding:0 11px;border:1px solid #cbd5e1;border-radius:6px}.radio{display:inline-flex;align-items:center;gap:6px}.period-inputs{display:flex;align-items:center;gap:8px}.period-inputs input[type=date]{height:36px;padding:0 10px;border:1px solid #cbd5e1;border-radius:6px}.editor-wrap{grid-column:1/-1;padding:18px;border-bottom:1px solid #e5e9f0}.editor-toolbar{display:flex;flex-wrap:wrap;gap:5px;padding:8px;border:1px solid #cbd5e1;border-bottom:0;border-radius:6px 6px 0 0;background:#f8fafc}.tool{min-width:34px;height:30px;padding:0 9px;border:1px solid #cbd5e1;border-radius:4px;background:#fff;color:#475569;cursor:pointer}.editor{min-height:260px;padding:18px;border:1px solid #cbd5e1;border-radius:0 0 6px 6px;outline:none;line-height:1.8}.editor:focus{border-color:#93b4ee;box-shadow:0 0 0 3px #dbeafe}.attachments-label{align-items:flex-start;padding-top:20px}.attachments{display:grid;gap:14px}.existing-files{display:grid;gap:8px}.existing-file{display:flex;align-items:center;gap:8px}.file-remove{border:0;background:transparent;color:#dc2626;text-decoration:underline;cursor:pointer}.dropzone{width:min(720px,100%);padding:25px;border:1px dashed #93b4ee;border-radius:8px;background:#f8fbff;text-align:center;color:#64748b;cursor:pointer}.dropzone.drag{border-color:var(--brand);background:#eff6ff;color:#1d4ed8}.dropzone strong{display:block;color:#334155}.file-note{font-size:12px}.new-files{display:grid;gap:6px}.actions{display:flex;align-items:center;gap:8px}.actions .right{display:flex;gap:8px;margin-left:auto}.btn{display:inline-flex;align-items:center;justify-content:center;height:36px;min-width:90px;padding:0 16px;border:1px solid var(--navy);border-radius:6px;background:var(--navy);color:#fff;font-weight:700;line-height:1;cursor:pointer}.btn-primary{border-color:var(--brand);background:var(--brand)}.btn-light{border-color:#94a3b8;background:#fff;color:#334155}.toast[hidden]{display:none}.toast{position:fixed;left:50%;bottom:30px;z-index:1100;transform:translateX(-50%);padding:11px 18px;border-radius:999px;background:#0f172a;color:#fff}@media(max-width:900px){.sidebar{display:none}.content{padding:18px}.page-head{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:120px minmax(0,1fr)}.field{flex-wrap:wrap}.period-inputs{flex-wrap:wrap}}@media(max-width:600px){.form-grid{display:block}.field-label{border-bottom:0}.field{border-left:0}.editor-wrap{padding:12px}.actions{flex-wrap:wrap}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="sidebar-head"><a class="logo" href="/"><img src="/images/kepco-es-logo.png" alt="켑코이에스 주식회사"></a></div><nav class="nav" aria-label="주 메뉴"><ul></ul></nav></aside><div class="main"><header class="topbar"><h1>사업관리시스템</h1><span class="pms">PMS</span><span class="user"><b>이희성 부장</b> [시스템관리자]</span></header><main class="content"><div class="page-head"><h2 id="pageTitle">공지사항 등록</h2><div class="crumb">HOME　›　공통 관리　›　공지사항 관리　›　<b id="crumbTitle">공지사항 등록</b></div></div><form id="noticeForm"><section class="card"><div class="form-grid"><div class="field-label">우선노출 <span class="requiredXd">*</span></div><div class="field"><label class="radio"><input type="radio" name="priority" value="Y" required> Y (우선노출)</label><label class="radio"><input type="radio" name="priority" value="N" checked> N (우선노출 안 함)</label></div><label class="field-label" for="title">제목 <span class="requiredXd">*</span></label><div class="field"><input id="title" type="text" maxlength="100" required placeholder="공지사항 제목을 입력하세요."></div><div class="field-label">게시기간 <span class="requiredXd">*</span></div><div class="field"><label class="radio"><input id="unlimited" type="radio" name="period" value="unlimited" checked> 무관</label><label class="radio"><input id="limited" type="radio" name="period" value="limited"> 기간 설정</label><div class="period-inputs"><input id="startDate" type="date" aria-label="게시 시작일" disabled><span>~</span><input id="endDate" type="date" aria-label="게시 종료일" disabled></div></div><div class="field-label">게시여부 <span class="requiredXd">*</span></div><div class="field"><label class="radio"><input type="radio" name="status" value="게시" checked> 게시</label><label class="radio"><input type="radio" name="status" value="미게시"> 미게시</label></div><div class="field-label">작성자 <span class="requiredXd">*</span></div><div class="field">이희성</div><div class="editor-wrap"><div class="editor-toolbar" aria-label="편집 도구"><button class="tool" type="button" data-command="bold"><b>B</b></button><button class="tool" type="button" data-command="italic"><i>I</i></button><button class="tool" type="button" data-command="underline"><u>U</u></button><button class="tool" type="button" data-command="insertUnorderedList">목록</button><button class="tool" type="button" data-command="justifyLeft">왼쪽</button></div><div class="editor" id="editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="공지 내용을 입력하세요."></div></div><div class="field-label attachments-label">첨부파일</div><div class="field attachments"><div class="existing-files" id="existingFiles" hidden><div class="existing-file"><span>협력업체_선정_세부기준.pdf</span><button class="file-remove" type="button">삭제</button></div><div class="existing-file"><span>협력업체_선정_세부기준_신구대비표.hwp</span><button class="file-remove" type="button">삭제</button></div></div><input id="fileInput" type="file" multiple hidden><label class="dropzone" id="dropzone" for="fileInput"><strong>파일을 마우스로 끌어오거나 클릭하여 선택해 주세요.</strong><span class="file-note">최대 200MB 이하의 파일을 등록할 수 있습니다.</span></label><div class="new-files" id="newFiles" aria-live="polite"></div></div></div></section><div class="actions"><a class="btn btn-light" href="/pms-notice-management.html">목록</a><div class="right"><button class="btn btn-primary" id="submitButton" type="submit">등록</button><button class="btn btn-light" type="button" id="cancel">취소</button></div></div></form></main></div></div><div class="toast" id="toast" hidden></div><script>
var params=new URLSearchParams(location.search),isEdit=params.get('mode')==='edit',title=document.getElementById('title'),editor=document.getElementById('editor'),existing=document.getElementById('existingFiles');if(isEdit){document.title='공지사항 수정 | 사업관리시스템(PMS)';document.getElementById('pageTitle').textContent='공지사항 수정';document.getElementById('crumbTitle').textContent='공지사항 수정';document.getElementById('submitButton').textContent='수정';title.value='협력업체 선정 세부기준이 개정되었습니다.';document.querySelector('[name=priority][value=Y]').checked=true;document.getElementById('limited').checked=true;document.getElementById('startDate').value='2026-07-01';document.getElementById('endDate').value='2026-07-31';document.getElementById('startDate').disabled=false;document.getElementById('endDate').disabled=false;editor.innerHTML='<h3>협력업체 선정 세부기준 개정 안내</h3><p>협력업체 선정의 공정성과 투명성을 강화하기 위해 세부기준이 개정되었습니다.</p><p>업무 담당자께서는 첨부된 개정 기준을 확인하시고 관련 업무에 반영해 주시기 바랍니다.</p>';existing.hidden=false}document.querySelectorAll('[name=period]').forEach(function(radio){radio.addEventListener('change',function(){var enabled=document.getElementById('limited').checked;document.getElementById('startDate').disabled=!enabled;document.getElementById('endDate').disabled=!enabled;if(enabled&&!document.getElementById('startDate').value){document.getElementById('startDate').value='2026-08-19';document.getElementById('endDate').value='2026-12-31'}})});document.querySelectorAll('[data-command]').forEach(function(button){button.addEventListener('click',function(){document.execCommand(button.dataset.command,false,null);editor.focus()})});document.querySelectorAll('.file-remove').forEach(function(button){button.addEventListener('click',function(){button.closest('.existing-file').remove()})});var input=document.getElementById('fileInput'),dropzone=document.getElementById('dropzone'),files=[];function renderFiles(){document.getElementById('newFiles').innerHTML=files.map(function(file,index){return '<div>• '+file.name+' ('+Math.ceil(file.size/1024).toLocaleString('ko-KR')+' KB) <button class="file-remove" type="button" data-index="'+index+'">삭제</button></div>'}).join('')}input.addEventListener('change',function(){files=files.concat(Array.from(input.files));renderFiles()});['dragenter','dragover'].forEach(function(type){dropzone.addEventListener(type,function(e){e.preventDefault();dropzone.classList.add('drag')})});['dragleave','drop'].forEach(function(type){dropzone.addEventListener(type,function(e){e.preventDefault();dropzone.classList.remove('drag');if(type==='drop'){files=files.concat(Array.from(e.dataTransfer.files));renderFiles()}})});document.getElementById('newFiles').addEventListener('click',function(e){var button=e.target.closest('[data-index]');if(!button)return;files.splice(Number(button.dataset.index),1);renderFiles()});document.getElementById('cancel').addEventListener('click',function(){history.length>1?history.back():location.href='/pms-notice-management.html'});document.getElementById('noticeForm').addEventListener('submit',function(e){e.preventDefault();if(!this.reportValidity())return;if(!editor.textContent.trim()){editor.focus();showToast('공지 내용을 입력해 주세요.');return}if(document.getElementById('limited').checked&&document.getElementById('startDate').value>document.getElementById('endDate').value){showToast('게시 종료일은 시작일 이후여야 합니다.');return}showToast(isEdit?'공지사항이 수정되었습니다.':'공지사항이 등록되었습니다.');setTimeout(function(){location.href=isEdit?'/pms-notice-view.html':'/pms-notice-management.html'},700)});function showToast(message){var toast=document.getElementById('toast');toast.textContent=message;toast.hidden=false;setTimeout(function(){toast.hidden=true},1800)}
</script><style>.actions{margin-top:10px}</style><script src="/assets/pms-lnb.js"></script></body></html>
