<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPC사 관리 | 사업관리시스템(PMS)</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/pms-lnb.css"><style>
  :root{--bg:#f1f5f9;--surface:#fff;--border:#d8dee8;--text:#1e293b;--muted:#64748b;--brand:#1d6ff2;--navy:#334155}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Noto Sans KR",sans-serif}a{color:inherit;text-decoration:none}ul{list-style:none;margin:0;padding:0}button,input,select{font:inherit}.layout{display:flex;min-height:100vh}.sidebar{width:248px;flex:0 0 248px;background:#fff;border-right:1px solid var(--border)}.sidebar-head{height:60px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid var(--border)}.logo img{height:30px}.nav{padding:16px 12px}.main{min-width:0;flex:1}.topbar{height:60px;padding:0 26px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--border)}.topbar h1{margin:0;font-size:19px}.pms{padding:4px 9px;border-radius:6px;background:#eff6ff;color:var(--brand);font-size:12px;font-weight:700}.user{margin-left:auto;color:#475569}.content{display:grid;gap:18px;min-width:0;padding:26px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.page-head h2{margin:0;font-size:25px;letter-spacing:-.03em}.crumb{color:var(--muted);font-size:13px}.card{background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 1px 2px rgba(15,23,42,.04)}.filters{position:relative;display:grid;padding:10px 150px 10px 20px}.filter-row{display:flex;align-items:center;gap:8px;min-height:50px;border-bottom:1px dashed #cbd5e1}.filter-row:last-of-type{border-bottom:0}.filter-row>label{width:100px;flex:none;white-space:nowrap;font-weight:700;color:#334155}.filter-row>label:before{content:'·';margin-right:6px}.ctrl{height:36px;padding:0 12px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#334155}.date{width:150px}.keyword{width:min(440px,52vw)}.quick{height:36px;padding:0 15px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#475569;cursor:pointer}.quick.on{border-color:#93b4ee;background:#eff6ff;color:#1d4ed8}.filter-actions{position:absolute;right:20px;top:50%;display:grid;gap:8px;width:100px;transform:translateY(-50%)}.btn{height:36px;padding:0 16px;border:1px solid var(--navy);border-radius:6px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}.btn-light{border-color:#94a3b8;background:#fff;color:#334155}.result-card{padding:18px 20px 22px}.list-tools{display:flex;align-items:center;gap:8px;margin-bottom:12px}.count{color:#475569}.spacer{flex:1}.table-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;min-width:1120px;border-collapse:collapse}th,td{height:48px;padding:10px 12px;border-right:1px solid #e5e9f0;border-bottom:1px solid #e5e9f0;text-align:center;white-space:nowrap}th:last-child,td:last-child{border-right:0}thead th{background:#f1f5f9;color:#334155;font-size:13px}tbody tr:last-child td{border-bottom:0}tbody tr:hover td{background:#f8fbff}.epc-link{color:#0969da;text-decoration:underline;font-weight:500}.contact{text-align:left}.state{display:inline-flex;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700}.state.normal{background:#ecfdf3;color:#15803d}.state.closed{background:#fff1f2;color:#be123c}.empty{height:160px;color:#94a3b8}.pagination{display:flex;justify-content:center;gap:5px;margin-top:22px}.pagination button{min-width:32px;height:32px;border:1px solid #cbd5e1;border-radius:4px;background:#fff;color:#475569;cursor:pointer}.pagination .on{border-color:var(--brand);background:var(--brand);color:#fff}.toast{position:fixed;left:50%;bottom:30px;z-index:1000;transform:translateX(-50%);padding:11px 18px;border-radius:999px;background:#0f172a;color:#fff}.toast[hidden]{display:none}@media(max-width:900px){.sidebar{display:none}.content{padding:18px}.page-head{align-items:flex-start;flex-direction:column}.filters{padding-right:20px}.filter-actions{position:static;display:flex;width:auto;transform:none}.filter-row{flex-wrap:wrap}.keyword{width:100%}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="sidebar-head"><a class="logo" href="/"><img src="/images/kepco-es-logo.png" alt="켑코이에스 주식회사"></a></div><nav class="nav" aria-label="주 메뉴"><ul></ul></nav></aside><div class="main"><header class="topbar"><h1>사업관리시스템</h1><span class="pms">PMS</span><span class="user"><b>이희성 부장</b> [시스템관리자]</span></header><main class="content"><div class="page-head"><h2>EPC사 관리</h2><div class="crumb">HOME　›　공통 관리　›　<b>EPC사 관리</b></div></div>
  <section class="card" aria-label="검색 조건"><form class="filters" id="searchForm"><div class="filter-row"><label>조회기간</label><input class="ctrl date" id="startDate" type="date" value="2025-07-01" aria-label="시작일"><span>~</span><input class="ctrl date" id="endDate" type="date" value="2026-06-30" aria-label="종료일"><button class="quick" type="button" data-days="1">하루 전</button><button class="quick on" type="button" data-months="1">1개월</button><button class="quick" type="button" data-months="3">3개월</button><button class="quick" type="button" data-months="12">1년</button></div><div class="filter-row"><label for="businessState">휴·폐업 구분</label><select class="ctrl" id="businessState"><option value="">전체</option><option value="정상">정상</option><option value="휴업">휴업</option><option value="폐업">폐업</option></select></div><div class="filter-row"><label for="keyword">키워드 검색</label><select class="ctrl" id="keywordType"><option value="all">전체</option><option value="code">EPC사 코드</option><option value="name">EPC사명</option><option value="businessNumber">사업자등록번호</option><option value="representative">대표자명</option></select><input class="ctrl keyword" id="keyword" placeholder="검색어를 입력하세요."></div><div class="filter-actions"><button class="btn" type="submit">검색</button><button class="btn btn-light" type="reset">초기화</button></div></form></section>
  <section class="card result-card"><div class="list-tools"><span class="count">전체 <b id="count">0</b>건</span><span class="spacer"></span><select class="ctrl" aria-label="페이지당 개수"><option>10개씩</option><option>20개씩</option><option>50개씩</option></select></div><div class="table-scroll"><table><thead><tr><th>No</th><th>EPC사 코드</th><th>EPC사명</th><th>사업자등록번호</th><th>대표자명</th><th>거래 담당자</th><th>휴·폐업 구분</th><th>등록일</th><th>등록자</th><th>최종수정</th></tr></thead><tbody id="epcBody"></tbody></table></div><div class="pagination" aria-label="페이지 이동"><button type="button">«</button><button type="button">‹</button><button class="on" type="button">1</button><button type="button">2</button><button type="button">3</button><button type="button">4</button><button type="button">5</button><button type="button">›</button><button type="button">»</button></div></section>
</main></div></div><div class="toast" id="toast" hidden></div><script>
var epcs=[{no:'25,214',code:'02663',name:'큐비트엠스',businessNumber:'349-83-01795',representative:'이홍태, 윤지병',contact:'이희성 (leehee43@naver.com, 010-6844-2810)',state:'정상',created:'2026. 06. 09',creator:'이희성',updated:'2026.06.10(이희성)'},{no:'25,213',code:'02662',name:'에너지솔루션',businessNumber:'120-88-01982',representative:'김태준',contact:'김지윤 (jiyun@kepcoes.co.kr, 010-3211-8734)',state:'정상',created:'2026. 05. 22',creator:'이희성',updated:'2026.06.01(이희성)'},{no:'25,212',code:'02661',name:'그린이앤씨',businessNumber:'215-81-03210',representative:'박성호',contact:'박민수 (minsu@kepcoes.co.kr, 010-9281-1157)',state:'휴업',created:'2026. 04. 18',creator:'김지윤',updated:'2026.05.20(김지윤)'}],body=document.getElementById('epcBody'),count=document.getElementById('count');function render(rows){count.textContent=rows.length;body.innerHTML=rows.length?rows.map(function(item){return '<tr><td>'+item.no+'</td><td>'+item.code+'</td><td><a class="epc-link" href="/pms-epc-detail.html?code='+encodeURIComponent(item.code)+'">'+item.name+'</a></td><td>'+item.businessNumber+'</td><td>'+item.representative+'</td><td class="contact">'+item.contact+'</td><td><span class="state '+(item.state==='정상'?'normal':'closed')+'">'+item.state+'</span></td><td>'+item.created+'</td><td>'+item.creator+'</td><td>'+item.updated+'</td></tr>'}).join(''):'<tr><td class="empty" colspan="10">검색 결과가 없습니다.</td></tr>'}function search(){var state=document.getElementById('businessState').value,key=document.getElementById('keyword').value.trim().toLowerCase(),type=document.getElementById('keywordType').value;render(epcs.filter(function(item){var target=type==='all'?Object.values(item).join(' '):item[type]||'';return(!state||item.state===state)&&(!key||String(target).toLowerCase().includes(key))}))}document.getElementById('searchForm').addEventListener('submit',function(e){e.preventDefault();search()});document.getElementById('searchForm').addEventListener('reset',function(){setTimeout(function(){document.getElementById('startDate').value='2025-07-01';document.getElementById('endDate').value='2026-06-30';render(epcs)},0)});document.querySelectorAll('.quick').forEach(function(button){button.addEventListener('click',function(){document.querySelectorAll('.quick').forEach(function(item){item.classList.remove('on')});button.classList.add('on');var end=new Date(),start=new Date(end);if(button.dataset.days)start.setDate(start.getDate()-Number(button.dataset.days));else start.setMonth(start.getMonth()-Number(button.dataset.months));document.getElementById('endDate').value=end.toISOString().slice(0,10);document.getElementById('startDate').value=start.toISOString().slice(0,10)})});function showToast(message){var toast=document.getElementById('toast');toast.textContent=message;toast.hidden=false;setTimeout(function(){toast.hidden=true},1800)}render(epcs);
</script><script src="/assets/pms-lnb.js"></script></body></html>
